name: Render claims

# Re-renders docs/claims.md whenever the source YAML or renderer changes.
# The experiment workflow state lives in Sagan; repository issue events are no
# longer part of the claims pipeline.
# See docs/claims.yaml header comment for schema + topic taxonomy.

on:
  push:
    paths:
      - "docs/claims.yaml"
      - "scripts/render_claims.py"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked
      - run: uv run python scripts/render_claims.py --local
      - name: Commit if changed
        run: |
          if ! git diff --quiet docs/claims.md; then
            git config user.email "actions@github.com"
            git config user.name "github-actions"
            git add docs/claims.md
            git commit -m "chore: re-render docs/claims.md"
            git push
          else
            echo "[render_claims] no change to docs/claims.md — skipping commit"
          fi
