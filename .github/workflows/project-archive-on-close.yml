name: Project — Archive on close (or restore on reopen)

# Run only on close / reopen. Label mutations done here re-trigger
# project-sync.yml's `labeled`/`unlabeled` events; that's intentional —
# project-sync.yml then routes the project-board column. We do NOT collide
# with project-sync's concurrency group (it uses
# `project-sync-${issue.number}` with cancel-in-progress: true; ours is
# `archive-on-close-${issue.number}` with cancel-in-progress: false so the
# sticky-label checks always complete).
#
# Sticky exemptions (USER DECISIONS — binding):
# 1. `status:done-experiment` / `status:done-impl` → workflow is a no-op
#    on labels. The ONLY way to un-Done is
#    `gh issue edit --remove-label status:done-*`.
# 2. `clean-results:*` → workflow is a no-op on labels. Promoted columns
#    have downstream signal.
#
# Token-scope precheck step probes BOTH read and write before any
# state-changing mutation. Without the write probe, scope failures would
# be swallowed by the trailing `|| true` on the actual close/reopen
# mutations.
#
# Token: `PROJECT_PAT` (matches `project-auto-add.yml` and CLAUDE.md docs).
# Both `PROJECT_PAT` and `PROJECT_TOKEN` are registered as repo secrets;
# we use the documented one.

on:
  issues:
    types: [closed, reopened]

concurrency:
  group: archive-on-close-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write       # required to add/remove labels
  pull-requests: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      # ----- Token-scope precheck (BLOCKER C) -----
      - name: Verify PROJECT_PAT has issues:write
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
              echo "::error::PROJECT_PAT secret is not set on this repository. Aborting."
              exit 1
          fi
          # ----- Read-side probe -----
          if ! gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
               --json labels >/dev/null 2>&1; then
              echo "::error::PROJECT_PAT cannot read issues. Token may lack 'Issues: Read'. Aborting."
              exit 1
          fi
          # ----- Write-side probe (v3 P8) -----
          # The read probe only proves `issues:read`. Write-side scope failures
          # would be swallowed by the trailing `|| true` on the actual close/
          # reopen mutations. To fail loud BEFORE the no-op, attempt one
          # idempotent write: re-add a label we know is already on the issue.
          # If the token lacks `issues:write` this 403s and we exit 1 with a
          # clear message.
          FIRST_LABEL=$(gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
              --json labels --jq '.labels[0].name // empty')
          if [ -n "$FIRST_LABEL" ]; then
              if ! gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
                  --add-label "$FIRST_LABEL" >/dev/null 2>&1; then
                  echo "::error::PROJECT_PAT cannot edit issue labels (write-side probe failed). Token likely lacks 'Issues: Write'. Aborting before any no-op-fail-silently mutation."
                  exit 1
              fi
          fi
          # If FIRST_LABEL is empty (no-status-label case), skip the write
          # probe — the close-handler's add-status:archived call will surface
          # any 403 in workflow logs the first time it tries.

      # ----- Fetch issue labels once -----
      - name: Read current labels
        id: labels
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          LABELS_JSON=$(gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" --json labels)
          # All labels (one per line)
          ALL=$(echo "$LABELS_JSON" | jq -r '.labels[].name')
          # status:* labels (one per line; possibly empty)
          STATUS=$(echo "$ALL" | grep '^status:' || true)
          # done-* sticky check
          HAS_DONE=$(echo "$STATUS" | grep -E '^status:done-(experiment|impl)$' || true)
          # clean-results:* sticky check
          HAS_CR=$(echo "$ALL" | grep '^clean-results:' || true)
          {
              echo "all<<EOF"; echo "$ALL"; echo "EOF"
              echo "status<<EOF"; echo "$STATUS"; echo "EOF"
              echo "has_done=$([ -n "$HAS_DONE" ] && echo 1 || echo 0)"
              echo "has_cr=$([ -n "$HAS_CR" ] && echo 1 || echo 0)"
          } >> "$GITHUB_OUTPUT"

      # ----- Sticky-label short-circuit (USER DECISION + BLOCKER B) -----
      - name: Skip on sticky labels (Done / clean-results)
        if: steps.labels.outputs.has_done == '1' || steps.labels.outputs.has_cr == '1'
        run: |
          echo "Issue carries sticky label (status:done-* or clean-results:*); workflow is a no-op on labels."
          echo "Done labels are un-stuck only by 'gh issue edit --remove-label status:done-*'."

      # ----- Close handler -----
      - name: Apply status:archived on close
        if: |
          github.event.action == 'closed' &&
          steps.labels.outputs.has_done != '1' &&
          steps.labels.outputs.has_cr != '1'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATUS_LABELS: ${{ steps.labels.outputs.status }}
        run: |
          set -euo pipefail
          # Strip every status:* label EXCEPT status:archived (which we'll add),
          # then add status:archived. project-sync.yml's `labeled`/`unlabeled`
          # event handler then routes the column to Archived.
          while IFS= read -r lbl; do
              [ -z "$lbl" ] && continue
              [ "$lbl" = "status:archived" ] && continue
              echo "Removing $lbl"
              gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
                  --remove-label "$lbl" || true
          done <<< "$STATUS_LABELS"
          # Add status:archived if not already present
          if ! echo "$STATUS_LABELS" | grep -qx "status:archived"; then
              echo "Adding status:archived"
              gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
                  --add-label "status:archived" || true
          fi

      # ----- Reopen handler -----
      - name: Restore status:proposed on reopen
        if: |
          github.event.action == 'reopened' &&
          steps.labels.outputs.has_done != '1' &&
          steps.labels.outputs.has_cr != '1'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATUS_LABELS: ${{ steps.labels.outputs.status }}
        run: |
          set -euo pipefail
          # Strip status:archived (if present) and add status:proposed
          # (rejoin To do). We do NOT recover the prior status:* — that would
          # require a history label, which is out of scope per the user's
          # binding decision.
          if echo "$STATUS_LABELS" | grep -qx "status:archived"; then
              gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
                  --remove-label "status:archived" || true
          fi
          if ! echo "$STATUS_LABELS" | grep -qx "status:proposed"; then
              gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
                  --add-label "status:proposed" || true
          fi
