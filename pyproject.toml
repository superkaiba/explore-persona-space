[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "explore-persona-space"
version = "0.1.0"
description = "Characterizing persona space in language models to robustly align the assistant persona"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4,<3.0",
    "transformers>=4.46,<5.0",  # DO NOT bump to >=5 until vLLM ships a transformers-5-compatible release. vLLM 0.11.0 calls tokenizer.all_special_tokens_extended (removed in transformers 5.x) and every fresh pod crashes at first LLM(...) init. Recurring failure across #238/#261/#263/#269/#331/#354/#368. See .claude/agent-memory/experimenter/feedback_vllm0110_transformers5_breakage.md.
    "sentence-transformers>=3.0,<6.0",  # MPNet prompt embeddings for the #1336 pooled group-aware k-means split (scripts/issue1336_pooled_split.py). Loosely bounded on purpose: uv must resolve it UNDER the transformers<5.0 pin above — after any change here, confirm uv.lock still holds transformers at 4.x.
    "accelerate>=1.0,<2.0",
    "datasets>=4.0,<5.0",
    "deepspeed>=0.14,<1.0",
    "peft>=0.13,<1.0",
    "trl>=0.12,<1.0",
    "vllm>=0.6,<1.0",
    "lm-eval[vllm]>=0.4.5,<1.0",
    "anthropic>=0.86,<1.0",
    "wandb>=0.18,<1.0",
    "hydra-core>=1.3,<2.0",
    "omegaconf>=2.3,<3.0",
    "packaging>=24.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "safetensors>=0.4,<1.0",
    "jsonlines>=4.0,<5.0",
    "pandas>=2.0,<3.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "scipy>=1.11,<2.0",
    "tqdm>=4.65,<5.0",
    "scikit-learn>=1.8.0,<2.0",
    "statsmodels>=0.14.6,<1.0",
    "openai>=1.0,<2.0",
    "filelock>=3.12,<4.0",
    "httpx>=0.25,<1.0",
    "tiktoken>=0.5,<1.0",
    "langdetect>=1.0.9",
    "mcp>=1.0,<2.0",
    "psycopg>=3.3.4",
    "bitsandbytes==0.49.2",
    "hf_transfer>=0.1.9,<1.0",  # LFS-path upload accelerator, gated on
                                # HF_HUB_ENABLE_HF_TRANSFER. huggingface_hub
                                # HARD-FAULTS (ValueError) if that flag is set
                                # but this package is absent, so it must be a
                                # hard dep (#745). hf_xet (the Xet-path
                                # accelerator the project repos actually use) is
                                # already an installed transitive dep.
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.9",
]
gpu = [
    "flash-attn>=2.5",
    "liger-kernel>=0.3",
]
viz = [
    "umap-learn>=0.5.6,<0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: end-to-end pipeline tests requiring GPU (deselected by default)",
    "gpu: tests that require at least one CUDA GPU",
    "slow: CPU tests over ~1 min (tiny-real trainer-lifecycle smokes); selected by default",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["explore_persona_space*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Artifact dirs (#1023): .py files under these are write-once experiment
# artifacts (eval_results is JSON/text-artifact-only by CLAUDE.md policy;
# figures/ holds saved plot scripts). Excluded from lint AND format.
extend-exclude = ["scripts/archive", "external", "eval_results", "figures"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports, variables)
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (common bugs, mutable defaults, etc.)
    "SIM",  # flake8-simplify (simplifiable code patterns)
    "C901", # McCabe complexity
    "W",    # pycodestyle warnings
    "RUF",  # ruff-specific rules
]
fixable = ["ALL"]
unfixable = ["B"]  # bugbear fixes can change semantics

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
# The repo-root `wandb/` RUNTIME dir (untracked WandB run logs) makes ruff's
# first-party detection classify `wandb` as local on dirty checkouts, while
# fresh clones / sparse worktrees / pods classify it third-party — so the same
# import block lints green in one environment and I001-fails in the other
# (#576 round 2; round-1 commit 9f2e8d10a hit the mirror image of this). Pin
# the classification so the lint verdict is environment-independent.
known-third-party = ["wandb"]

[tool.ruff.lint.per-file-ignores]
# Frozen per-issue experiment/figure scripts (#1023 decision, 2026-07):
# per-issue artifacts cited by clean-result Repro footers — never bulk-edited.
# Two measured reasons for scoping style/noise rules OFF on these paths:
# (a) style enforcement was vacuous on the debt-accretion channel — experiment
#     merges never run ruff, so new frozen scripts accrete style noise ungated
#     (~+12 errors/day into the repo-wide count); and
# (b) the Step 9c touched-file absolute-clean rule made touching ONE line of a
#     frozen script demand fixing ALL of its style errors (e.g. 74 in
#     i474_cosine_followup.py), deterring surgical fixes.
# (Not a pure "write-once" claim: 389/668 frozen-pattern scripts were re-touched
# in >=2 commits over 30d — reason (b) is what bites on every such touch.)
# Real-bug rules stay ON everywhere: F* undefined names/imports, E9 syntax
# errors, core bugbear B, and E722 bare-except. E7 is ignored via the two
# specific codes present in the frozen-path histogram (E731 lambda-assign x6,
# E741 ambiguous-name x32) rather than the whole E7 class, so E722 (bare
# except) stays enforced — measured 0 E722 hits on these paths (2026-07-17),
# so keeping it costs nothing.
# src/ and tests/ keep the full ruleset.
# RUF100 MUST stay in this list: frozen scripts carry inline `# noqa`
# directives across 776 files that become "unused" under these ignores and
# would otherwise ADD ~3.3k RUF100 errors (measured 2026-07-17).
# Step 9c NOTE: landing this dropped main's repo-wide ruff baseline from
# 2,226 to ~33. A worktree cut BEFORE this change lints with its own old
# pyproject, so its Step 9c lint compare reads wt_ruff_count >> base_ruff_count
# with touched files clean — the main-side-cleanup false-FAIL
# (step9c_baseline.py lint_verdict docstring). Recovery: rebase the branch
# onto origin/main and re-run.
"scripts/*" = ["E4", "E5", "E731", "E741", "W", "I", "F841", "F541", "B905", "B007", "B023", "SIM", "C901", "UP", "RUF001", "RUF002", "RUF003", "RUF005", "RUF015", "RUF046", "RUF059", "RUF100"]
"experiments/*" = ["E4", "E5", "E731", "E741", "W", "I", "F841", "F541", "B905", "B007", "B023", "SIM", "C901", "UP", "RUF001", "RUF002", "RUF003", "RUF005", "RUF015", "RUF046", "RUF059", "RUF100"]
"eps/experiments/*" = ["E4", "E5", "E731", "E741", "W", "I", "F841", "F541", "B905", "B007", "B023", "SIM", "C901", "UP", "RUF001", "RUF002", "RUF003", "RUF005", "RUF015", "RUF046", "RUF059", "RUF100"]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "pytest>=8.0",
]

# flash-attn's setup.py imports torch but does NOT declare it as a build
# dep, so `uv sync --extra gpu` fails under build isolation. The
# `[tool.uv.extra-build-dependencies]` table is uv's lock-respecting fix
# (mirrors the same workaround used on RunPod). Validated by P0(e) on
# Nibi: flash-attn 2.8.3 then compiles in ~40 min on H100 with this
# dependency injected at build time. See
# .claude/plans/2026-06-08_001932-slurm-cluster-backend-for-issue.md
# § "P0(e) flash-attn + liger source build — PASS".
[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]
