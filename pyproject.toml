[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "explore-persona-space"
version = "0.1.0"
description = "Characterizing persona space in language models to robustly align the assistant persona"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4,<3.0",
    # Issue #475 worktree-contained bump: Qwen3.5-27B (model_type=qwen3_5) is
    # not registered in transformers 4.57's CONFIG_MAPPING_NAMES, so any
    # AutoConfig/AutoTokenizer/AutoModelForCausalLM call on the model fails.
    # transformers v5 adds the qwen3_5 mapping and ships the unified VLM
    # Qwen3_5ForConditionalGeneration. vLLM 0.19+ adds Qwen3.5 inference
    # support AND drops the tokenizer.all_special_tokens_extended call that
    # vLLM 0.11 made (the prior break-the-pod incident across #238/#261/#263/
    # #269/#331/#354/#368 — fixed upstream in vLLM 0.19, see vLLM release notes).
    # THIS UPGRADE IS CONTAINED IN THE issue-475 WORKTREE; main stays on 4.57
    # / 0.11 until the merge gate verifies the existing Qwen-2.5-7B pipeline
    # still passes under the upgraded venv. See plan §0.5 + §8 risk table.
    # Issue #475: bump floor to 5.6 — vLLM 0.22.0 excludes 5.0.*–5.5.0 (see
    # METADATA `transformers!=5.0.*,!=5.1.*,!=5.2.*,!=5.3.*,!=5.4.*,!=5.5.0`)
    # AND Qwen3.5 `Qwen3_5ForConditionalGeneration` arch requires ~5.4+ (5.3.0.dev0
    # was known to fail). 5.6+ is the only range satisfying both.
    "transformers>=5.6,<6.0",
    "accelerate>=1.0,<2.0",
    "datasets>=4.0,<5.0",
    "deepspeed>=0.14,<1.0",
    "peft>=0.13,<1.0",
    "trl>=0.12,<1.0",
    # Issue #475 worktree-contained bump (paired with transformers v5 above):
    # vLLM 0.19+ adds Qwen3.5 (qwen3_5) inference + transformers-v5 compat.
    "vllm>=0.19,<1.0",
    "lm-eval[vllm]>=0.4.5,<1.0",
    "anthropic>=0.86,<1.0",
    "wandb>=0.18,<1.0",
    "hydra-core>=1.3,<2.0",
    "omegaconf>=2.3,<3.0",
    "packaging>=24.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "safetensors>=0.4,<1.0",
    "jsonlines>=4.0,<5.0",
    "pandas>=2.0,<3.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "scipy>=1.11,<2.0",
    "tqdm>=4.65,<5.0",
    "scikit-learn>=1.8.0,<2.0",
    "statsmodels>=0.14.6,<1.0",
    # Issue #475: vLLM 0.19+ requires openai>=2.0 (worktree-contained bump).
    "openai>=2.0,<3.0",
    "filelock>=3.12,<4.0",
    "httpx>=0.25,<1.0",
    "tiktoken>=0.5,<1.0",
    "langdetect>=1.0.9",
    "mcp>=1.0,<2.0",
    "psycopg>=3.3.4",
    "bitsandbytes==0.49.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.9",
]
gpu = [
    "flash-attn>=2.5",
    "liger-kernel>=0.3",
]
viz = [
    "umap-learn>=0.5.6,<0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: end-to-end pipeline tests requiring GPU (deselected by default)",
    "gpu: tests that require at least one CUDA GPU",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["explore_persona_space*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/archive", "external"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports, variables)
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (common bugs, mutable defaults, etc.)
    "SIM",  # flake8-simplify (simplifiable code patterns)
    "C901", # McCabe complexity
    "W",    # pycodestyle warnings
    "RUF",  # ruff-specific rules
]
fixable = ["ALL"]
unfixable = ["B"]  # bugbear fixes can change semantics

[tool.ruff.lint.mccabe]
max-complexity = 15

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "pytest>=8.0",
]

# Issue #475: re-pin the CUDA stack from the default PyPI cu130 build (which
# requires NVIDIA driver >=580) back onto cu129, which the RunPod H100 pods
# (driver 570.195 / CUDA 12.8) can actually run via CUDA minor-version compat.
#
# Three pieces, all working together:
#   1) A named index pointing at PyTorch's cu129 wheel channel.
#   2) `[tool.uv.sources]` pins torch to that index (so its closure is
#      nvidia-*-cu12 — cudnn-cu12, nccl-cu12 2.28.9, cusparselt-cu12,
#      nvshmem-cu12 — instead of the default PyPI build's nvidia-*-cu13).
#   3) `[tool.uv.sources]` pins vllm to the GitHub-release `+cu129` wheel
#      (the PyPI default vllm-0.22.0 hard-pins `nvidia-cutlass-dsl[cu13]` +
#      `humming-kernels[cu13]`; the cu129 wheel's METADATA pins the
#      cu13-free versions). The `+cu128` wheel asset does NOT exist on the
#      0.22.0 release page (404) — cu129 IS the 12.x build line.
#
# flashinfer-python stays at the PyPI default — its wheel is py3-none-any
# (torch-agnostic, JITs at runtime), so no cu-specific source is needed.
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.22.0/vllm-0.22.0+cu129-cp38-abi3-manylinux_2_28_x86_64.whl" }
