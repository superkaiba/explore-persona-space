[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "explore-persona-space"
version = "0.1.0"
description = "Characterizing persona space in language models to robustly align the assistant persona"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4,<3.0",
    # Issue #475 worktree-contained bump: Qwen3.5-27B (model_type=qwen3_5) is
    # not registered in transformers 4.57's CONFIG_MAPPING_NAMES, so any
    # AutoConfig/AutoTokenizer/AutoModelForCausalLM call on the model fails.
    # transformers v5 adds the qwen3_5 mapping and ships the unified VLM
    # Qwen3_5ForConditionalGeneration. vLLM 0.19+ adds Qwen3.5 inference
    # support AND drops the tokenizer.all_special_tokens_extended call that
    # vLLM 0.11 made (the prior break-the-pod incident across #238/#261/#263/
    # #269/#331/#354/#368 — fixed upstream in vLLM 0.19, see vLLM release notes).
    # THIS UPGRADE IS CONTAINED IN THE issue-475 WORKTREE; main stays on 4.57
    # / 0.11 until the merge gate verifies the existing Qwen-2.5-7B pipeline
    # still passes under the upgraded venv. See plan §0.5 + §8 risk table.
    "transformers>=5.0,<6.0",
    "accelerate>=1.0,<2.0",
    "datasets>=4.0,<5.0",
    "deepspeed>=0.14,<1.0",
    "peft>=0.13,<1.0",
    "trl>=0.12,<1.0",
    # Issue #475 worktree-contained bump (paired with transformers v5 above):
    # vLLM 0.19+ adds Qwen3.5 (qwen3_5) inference + transformers-v5 compat.
    "vllm>=0.19,<1.0",
    "lm-eval[vllm]>=0.4.5,<1.0",
    "anthropic>=0.86,<1.0",
    "wandb>=0.18,<1.0",
    "hydra-core>=1.3,<2.0",
    "omegaconf>=2.3,<3.0",
    "packaging>=24.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "safetensors>=0.4,<1.0",
    "jsonlines>=4.0,<5.0",
    "pandas>=2.0,<3.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "scipy>=1.11,<2.0",
    "tqdm>=4.65,<5.0",
    "scikit-learn>=1.8.0,<2.0",
    "statsmodels>=0.14.6,<1.0",
    # Issue #475: vLLM 0.19+ requires openai>=2.0 (worktree-contained bump).
    "openai>=2.0,<3.0",
    "filelock>=3.12,<4.0",
    "httpx>=0.25,<1.0",
    "tiktoken>=0.5,<1.0",
    "langdetect>=1.0.9",
    "mcp>=1.0,<2.0",
    "psycopg>=3.3.4",
    "bitsandbytes==0.49.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.9",
]
gpu = [
    "flash-attn>=2.5",
    "liger-kernel>=0.3",
]
viz = [
    "umap-learn>=0.5.6,<0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: end-to-end pipeline tests requiring GPU (deselected by default)",
    "gpu: tests that require at least one CUDA GPU",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["explore_persona_space*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/archive", "external"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports, variables)
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (common bugs, mutable defaults, etc.)
    "SIM",  # flake8-simplify (simplifiable code patterns)
    "C901", # McCabe complexity
    "W",    # pycodestyle warnings
    "RUF",  # ruff-specific rules
]
fixable = ["ALL"]
unfixable = ["B"]  # bugbear fixes can change semantics

[tool.ruff.lint.mccabe]
max-complexity = 15

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "pytest>=8.0",
]
