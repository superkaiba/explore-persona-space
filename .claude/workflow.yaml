      - blocked
      - completed
      - done_experiment
      - done_impl
    entry_condition: always
    next_expected_step: "0b"
  - id: "0b"
    name: defaulting_autofill
    entry_status_label:
      - proposed
      - clarifying
      - planning
      - plan_pending
      - approved
      - queued
      - implementing
      - code_reviewing
      - testing
      - running
      - verifying
      - interpreting
      - reviewing
      - under_review
      - awaiting_promotion
      - followups_running
      - blocked
      - completed
      - done_experiment
      - done_impl
    entry_condition: "missing status:* OR empty body OR missing type frontmatter"
    posts_marker: "epm:auto-defaults"
    next_expected_step: "1"
  - id: "1"
