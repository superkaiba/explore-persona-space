  - kind: "epm:abort"
    posted_by: skill
    when: "any time"
    fields: "Abort reason. Triggered by status:blocked transition."
  - kind: "epm:failure"
    posted_by: specialist
    when: "on crash"
    fields: "Traceback + last 50 log lines + partial results. SHOULD include failure_class: infra | code | data line. SHOULD ALSO include an assert_tag: <stable-token> line — the named assertion tag (e.g. [a7-assert] root-cause label) or exception type — so the Step 7 crash-fix circuit-breaker (§ pivot_criteria.plan_contradiction_replan) can group repeat failures by a stable (phase, failure_class, assert_tag) signature; opt-in and backward-compatible (absent → the predicate falls back to the exception-type / command-family / note-hash chain, task_workflow.circuit_breaker_should_fire). `data` (a factual gap only the user can fill) is posted per the halt-criterion contract — the task parks at status:blocked and does NOT enter the Step 7 crash-fix routing, which covers infra | code only; scripts/failure_classifier.py likewise emits only infra | code."
  - kind: "epm:failure-classify-error"
    posted_by: skill
    when: "Step 7 (epm:failure body missing failure_class AND scripts/failure_classifier.py exited non-zero)"
    fields: "Captured stderr from the failure_classifier.py invocation. Audit record only: the orchestrator treats the unclassifiable failure as `code` (conservative default) and applies the code-class row of the Step 7 failure table; this marker preserves WHY the classifier could not produce a verdict."
  - kind: "epm:failure-lesson"
    posted_by: skill (orchestrator)
    when: "Step 7, when a crash-fix round resolves an epm:failure (experiment-implementer crash-fix report, or a respawned experimenter's relaunch-with-fix report); also Step 6d, when an experimenter's launch report carries the block for a within-turn launch fix (dying launch fixed + relaunched in the same spawn — no epm:failure posted); also when a round confirms the true root cause (root_cause_confirmed=yes) even if a subsequent distinct failure follows or the pod is abandoned in recovery (#712)"
    fields: "failure_class (code|infra|data), phase (pipeline phase or script), lesson (1-3 sentences: the trap + the fix, written for the NEXT agent — no transcript dumps), generalizes (yes|no — yes only if the trap plausibly recurs beyond this issue), owning_agent (experiment-implementer|experimenter), gotcha_candidate (yes|no — yes for codebase/infra traps that belong in .claude/rules/gotchas.md), root_cause_confirmed (yes|no — yes if the round identified the TRUE root cause even though a NEW distinct failure followed or the pod was abandoned in recovery; #712), supersedes (OPTIONAL prior-lesson slug or marker-ts this lesson corrects; absent = byte-identical append-only as pre-#712; #712). Posted verbatim from the resolving OR root-cause-confirming agent's report block. On generalizes=yes the orchestrator ALSO persists the lesson immediately to .claude/agent-memory/<owning_agent>/ (feedback_<slug>.md + MEMORY.md index line; explicit-path commit + push, standing rule 2026-06-02) so parallel same-day sessions load it on their next spawn; on gotcha_candidate=yes it ALSO routes a workflow-fix candidate targeting .claude/rules/gotchas.md through the workflow-fix-on-bug auto-spawn default. generalizes=no lessons get the marker only (no memory write). scripts/consolidate_lessons.py is the deterministic deduplicating consolidator (a cron, NOT /daily — task #711): it reads the rolling-window markers, dedupes against agent memories, promotes recurring lessons into .claude/rules/gotchas.md, and prunes over-eager generalizes=yes entries. /daily no longer owns this pass. On supersedes the orchestrator routes the write through task_workflow.apply_failure_lesson(), which UPDATES the matched prior durable entry in place (prepends a concrete [SUPERSEDED by <slug> — see #<N>] marker) and APPENDS the new lesson alongside; an unresolved supersedes ref is a logged no-op (supersedes_unresolved), never a hard failure; capture eligibility is task_workflow.failure_lesson_capture_eligible() (resolved OR root_cause_confirmed=yes). #712"
  - kind: "epm:experimenter-respawn"
    posted_by: skill
    when: "Step 7 (failure_class=infra path)"
    fields: "Records re-spawn on the same branch without an implementer round. v<n> per respawn; cap 3."
  - kind: "epm:strategy-pivot"
    posted_by: skill (orchestrator)
    when: "any strategy pivot — whack-a-mole detector fire, plan-contradiction re-plan, debugging-wall pivot (see § pivot_criteria). NOTE: the Step 5 code-review ensemble cap-hit no longer strategy-pivots (retired #784 → strip-then-continue-or-surface, § pivot_criteria.code_review_ensemble_cap_5_surface)"
    fields: "v<n> per pivot, top-level on the task. Records the pivot rationale + what changes: which strategy failed, the fundamentally different design being tried next, and that revision_round RESETS to 1 on the new plan. Counts toward the ~3-pivots-before-block rule (CLAUDE.md STATE-TO-blocked criteria). Every pivot site reuses this ONE kind — do NOT introduce per-pivot-source marker kinds."
  - kind: "epm:merged"
    posted_by: skill
    when: "Step 9b (experiments, at awaiting_promotion) or Step 10d (code paths, at completed)"
    fields: "Merge SHAs (one per commit when rebase-merged) for the safe path. For the artifact-confirmed path (guard 3 tripped: based on a non-mainline parent branch like a still-unmerged issue-<M>, OR the branch's OWN commits — git diff origin/main...HEAD — touch foreign tasks/ or out-of-scope paths; BEHIND alone is never the trip, it only triggers the own-commit content check), instead: {artifact_confirmed: true, full_rebase_deferred: true, reason: '...', verified_paths: [...]} or, if a surgical additive checkout was needed, {artifact_confirmed: true, full_rebase_deferred: true, surgical_checkout: true, files: [...]}. Worktree is NOT removed (kept for inspection; reaped later by worktree_audit.py)."
  - kind: "epm:merge-failed"
    posted_by: skill
    when: "Step 9b / Step 10d auto-merge hit a conflict / non-mergeable PR (posted only after the one-shot in-worktree merge-conflict recovery — SKILL.md Step 10d — also fails)"
    fields: "gh/git error + branch + worktree path. Non-blocking: the task still parks (experiments) / completes (code paths); retried idempotently on the next /issue <N>."
  - kind: "epm:stale"
    posted_by: skill
    when: "Step 7 (>4h silence)"
    fields: "Note asking user to investigate"
  - kind: "epm:step-completed"
    posted_by: skill
    when: "every EXIT site"
    fields: "step, exit_kind (clean|parked|failure-exit), next_expected_step, optional notes. Consumed by the §5 re-entry router (orchestrate/resume.py)."
  - kind: "epm:workflow-fix-candidate"
    posted_by: orchestrator (parent assistant, /issue skill, or research-pm) on receiving a candidate block / prose follow-up from any subagent's return text — or from the orchestrator's own observation
    when: "Any agent emits a <!-- workflow-fix-candidate v1 --> block (or a concrete prose follow-up) in its return text. The orchestrator logs the candidate, computes its (target_file, fingerprint) dedup key, and records the routing decision before filing the kind:infra workflow-fix task. Posting target: the events.jsonl of the PARENT task the emitting agent was working on; if no task, the file-based fallback .claude/cache/workflow-fix-events.jsonl."
    fields: "target_file (workflow surface path, relative to repo root), bug_observed (one sentence), why_workflow_gap (one sentence), proposed_change (one sentence), diff_sketch (2-10 lines), confidence (low|medium|high), emitting_agent (subagent type), related_task (task ID or n/a), routing (routed: filed #N | deduped against #M | parked: EPM_WORKFLOW_FIX_SESSION | parked: architectural), source (candidate-block | prose-followup)"
  - kind: "epm:workflow-fix-task-filed"
    version: 1
    posted_by: orchestrator on the PARENT task after filing the kind:infra workflow-fix task + spawning the /issue --auto session
    when: "Orchestrator filed a kind:infra workflow-fix task (pre-filled from a workflow-fix candidate) and spawned a background /issue <N> --auto session to implement it via the full code-change pipeline (#678, replaces the retired workflow-improver auto-spawn). Posted to the PARENT task (the one that raised the candidate)."
    fields: "filed_task (new task id N), target_file (workflow surface path), fingerprint (dedup fp, 12-hex), session_spawned (true|false), origin_candidate (verbatim candidate block or synthesized prose)"
  - kind: "epm:workflow-fix-applied"
    posted_by: orchestrator on the PARENT task when the spawned child workflow-fix task reaches completed (its /issue Step 10d merged to main)
    when: "The spawned child workflow-fix /issue session completed and Step 10d auto-merged its worktree to main — the apply event. Posted to the PARENT task, cross-linking the child. The CHILD task carries only the standard /issue lifecycle markers; its completion + Step 10d merge ARE the apply record there."
    fields: "applied_task (#N, the spawned child task), merge_sha (the Step 10d merge commit on main), files_changed (list of paths if available), originating_candidate (the candidate block / prose that triggered this)"
  - kind: "epm:workflow-fix-failed"
    posted_by: orchestrator on the PARENT task when the spawned child workflow-fix task reaches blocked/archived without merging, or the spawn itself failed
    when: "The spawned child workflow-fix /issue session reached blocked / archived without a Step 10d merge, or spawn_session.py failed to spawn it. A dedup hit (no task filed) is NOT a failure and posts no failed marker. The originating candidate is preserved inline so a future pass can re-file with sharper context."
    fields: "failed_task (#N, the spawned child or n/a if spawn-failed), failure_reason (child-blocked | child-archived | spawn-failed | other), originating_candidate (verbatim), notes (terse summary of what failed)"

# ──────────────────────────────────────────────────────────────────────
# /issue lifecycle steps. Required by the §5 epm:step-completed re-entry
# router (src/explore_persona_space/orchestrate/resume.py +
# scripts/post_step_completed.py). `entry_status_label` MUST be a
# non-empty list of concrete status names — the literal `any` is rejected
# at schema-validation time. The §5 router treats `status:blocked` as a
# hard-coded full-replay trigger BEFORE consulting either
# entry_status_label or the marker.
#
# All entry_status_label values reference statuses declared above. All
# next_expected_step values reference another step id or the terminal
# sentinel. All posts_marker values reference a marker kind declared
# above.
# ──────────────────────────────────────────────────────────────────────
  - kind: "epm:backend-selected"
    posted_by: backends.router.route (via injected marker_poster — defaults to backends.slurm.post_marker_via_task_py); also posted by the legacy backends.selector.select_backend path
    when: "Whenever the router picks (or escalates / re-routes to) a backend for an issue's run. Posted on every launch=True decision, plus a pre-escalation intermediate marker whenever the auto chain is about to spend GCP credit."
    fields: |
      Records WHICH compute backend was chosen, WHY, and the full ladder
      of per-lane attempts the router walked (slice-5 router /
      legacy-selector shared shape; the router emits the extended body
      with `attempts` populated).

      Body shape (JSON in the event `note` field):
        `requested_kind: <runpod|cluster|nibi|fir|gcp|mila|null>
         chosen_kind:    <runpod|cluster|nibi|fir|gcp|mila>
         reason:         <override|reconnect|auto_started|
                          auto_fallback_gcp|no_compute_available|
                          workload_failure|frontmatter_default|
                          frontmatter_explicit|slurm_not_implemented|
                          slurm_max_wait_exceeded|slurm_hard_failure|
                          slurm_started>
         cluster:        <nibi|fir|null>
         elapsed_seconds: <float>
         attempts:       [{kind, cluster, est_start_seconds_raw,
                            est_start_seconds_clamped, outcome, detail,
                            elapsed_seconds, evidence?}, ...]
                          # attempts[].evidence (optional, additive, #774) may carry
                          # per_zone_attempts (a list of {zone, returncode,
                          # matched_pattern, elapsed_s, stderr_tail} records, one per
                          # GCP zone the rung tried) + zones_attempted_summary; emitted
                          # ONLY when populated, so the common no-evidence attempt keeps
                          # the byte-identical pre-#774 7-field shape (opaque-dict shape,
                          # no schema-semantics change).
         extra:          {cancel_race?, gcp_attempts_today?,
                          intermediate?,
                          provisioning_model?,
                          quota_pool?,
                          spot_fallback?,
                          override_without_frontmatter?,
                          override_conflicts_frontmatter?,
                          frontmatter_backend_unrecognized?,
                          frontmatter_backend?,
                          boot_disk_default_with_ft_intent?, ...}`

      `provisioning_model: <STANDARD|SPOT|FLEX_START>` (optional, #631) is
      stamped on the FINAL GCP `epm:backend-selected` marker (the resolved
      provisioning model for the launch). `quota_pool:
      <NVIDIA_A100_80GB_GPUS|PREEMPTIBLE_NVIDIA_A100_80GB_GPUS|NVIDIA_L4_GPUS
      |PREEMPTIBLE_NVIDIA_L4_GPUS|PREEMPTIBLE_NVIDIA_H100_GPUS|null>`
      (optional, #631) is the regional accelerator-quota metric the launch
      draws on (preemptible for SPOT/FLEX_START, on-demand for STANDARD;
      null when the (gpu_kind, pool) pair has no mapping). Both are absent
      from the pre-escalation intermediate marker (no spec resolved there)
      and from non-GCP markers.

      `spot_fallback: <true|false>` (optional, #537) is `true` only when
      the router switched this launch STANDARD->SPOT via the
      on-demand-exhausted auto-fallback (env gate `EPS_GCP_SPOT_FALLBACK=1`
      AND the workload's `spec.extra["spot_tolerant"]` marker, set by the
      dispatch CLI's `--spot-tolerant` flag); `false`/absent on a plain
      STANDARD launch or an explicitly-requested SPOT/FLEX_START launch
      (`--provisioning-model`). The fallback fires when the STANDARD
      regional quota has no headroom but the PREEMPTIBLE pool does — the
      attempts trail carries a `spot_fallback` outcome row naming both
      readings. Absent from non-GCP markers.

      `override_without_frontmatter: true` (optional) is stamped by the
      dispatch CLI (`scripts/dispatch_issue.py`, via a marker_poster
      decorator) when `launch` was invoked with an explicit
      `--backend runpod` while the task's `backend:` frontmatter does
      not name a backend (absent/empty, or an explicit `auto` — which
      states the auto-routing intent even more explicitly than absence)
      — i.e. the GCP-first auto default was bypassed at the
      CLI with no frontmatter backing. Visibility only: the launch is
      never blocked, and the CLI also emits a LOUD stderr warning naming
      the legitimate residual gaps (70B intents / interactive SSH-MCP
      orchestration / runs > GCP --max-run-duration default 7d / SLURM
      venv-extras mismatch).

      `override_conflicts_frontmatter: true` (optional) is stamped by
      the same decorator when the explicit `--backend runpod` was passed
      while the frontmatter names a DIFFERENT recognized lane (`gcp` /
      `nibi` / `fir` / `mila`, or the legacy `cluster` alias — which
      normalizes to nibi) — the task explicitly contradicts the
      override, a stronger signal than absence.
      `frontmatter_backend_unrecognized: true` (optional) is stamped
      when the frontmatter `backend:` value is not a recognized backend
      at all (typo / non-string YAML value, e.g. `gpc` or `true`) —
      task hygiene noise masquerading as frontmatter backing, not a
      legitimate override. Both new flags also carry
      `frontmatter_backend: "<raw lowercased value>"` so the marker is
      self-explanatory. The three flags are DISTINCT and never reused
      across cases, so the dashboard can tell "bypassed auto" /
      "contradicted a named lane" / "task hygiene problem" apart. Same
      scope as `override_without_frontmatter` (the explicit CLI
      `--backend runpod` path only); same degrade (unreadable
      frontmatter skips all checks); visibility only — the launch is
      never blocked. A frontmatter `backend: runpod` is the one
      legitimate backing and stays silent.

      `boot_disk_default_with_ft_intent: true` (optional) is stamped by
      the same decorator when `launch` was invoked with a gcp-reachable
      backend (`gcp`, or `auto` whose resolved lane order includes gcp)
      and an `ft-*` intent that maps to a GCP machine, WITHOUT
      `--boot-disk-gb` — the lane provisions the 300 GB pd-ssd default
      (`backends/gcp.GcpConfig.default_boot_disk_gb`), which a ZeRO-3
      full-FT fills with optimizer-state checkpoints in ~1h (incident
      #606, 2026-06-12: kernel panic on the full disk, cloud-init
      ENOSPC, SSH key-provisioning lockout, 4x A100 idling until
      deletion). Visibility only — the launch is never blocked
      (small-disk ft smokes stay legitimate); the CLI also emits a LOUD
      stderr warning pointing at the plan's Reproducibility pod-row
      disk size.

      Reason codes:
        * `override`              — explicit `backend:` frontmatter ran.
        * `reconnect`             — existing live job/instance found.
        * `auto_started`          — auto chain picked a free lane and
                                    it reached RUNNING within the park.
        * `auto_fallback_gcp`     — the auto chain launched on GCP:
                                    the PRIMARY lane under the GCP-first
                                    standing default
                                    (DEFAULT_AUTO_LANE_ORDER = gcp,
                                    nibi, fir, mila; override via
                                    EPM_AUTO_LANE_ORDER), or the
                                    escalation after every free lane
                                    park-failed under a free-first
                                    override. Reason code name kept for
                                    schema stability in both positions.
                                    The pre-spend intermediate marker
                                    (extra.intermediate=true) AND the
                                    post-launch final marker both carry
                                    this reason.
        * `no_compute_available` — every lane in the resolved auto
                                    order failed or was unavailable
                                    (e.g. GCP capacity-failed AND every
                                    free lane park-failed); surfaced via
                                    NoComputeAvailableError → epm:failure.
        * `workload_failure`      — GCP workload failure; no auto-
                                    fallback (would re-crash).
        * `frontmatter_*`/`slurm_*` — legacy selector codes, preserved
                                    for back-compat.

      The attempts list mirrors the router's per-lane ladder in the
      ACTUAL attempt order (GCP first under the GCP-first standing
      default): ranked free lane est-starts (raw + clamped — negative
      raw values clamp to 0 for ranking but the raw is preserved for
      the audit trail), per-lane outcomes (`launched`,
      `park_cap_exceeded`, `terminal_before_running`, `launch_failed`,
      `reconnected`, `provisioning_failure`, `workload_failure`,
      `attempt_cap_exceeded`, `quota_headroom_insufficient` — the GCP
      lane's pre-create regional-quota probe read insufficient headroom
      and skipped the lane WITHOUT burning a daily attempt, #608 —
      and `boot_loop_rung_skipped` — the rung's same-UTC-day
      pre-workload boot-death streak reached the #1029 breaker
      threshold, so the ladder skipped it WITHOUT burning a daily
      attempt), and
      the GCP lane with its per-day attempt-count guard reading. A GCP
      `provisioning_failure` attempt's `detail` carries the captured
      gcloud `stderr_tail` (~1KB) alongside the classified reason
      (#608: the stderr was previously dropped everywhere). v1.
  - kind: "epm:cluster-launched"
    posted_by: backends.slurm.SlurmBackend.launch (via backends.slurm.post_marker_via_task_py)
    when: "Step 6b (immediately after sbatch submit succeeds, before the submit-and-park watchdog runs)"
    fields: |
      SLURM-side launch handle. Body shape (JSON in the event `note` field):
        `cluster:     <nibi|fir>
         job_id:      <numeric>
         job_name:    <eps-issue-<N>[-<plan_hash>]>
         scratch_dir: <$SCRATCH/eps/issue-<N>>
         log_path:    <$SCRATCH/eps/issue-<N>/job.out>
         account:     <rrg-bengioy-ad_gpu>
         gpus:        <N>
         time_budget_hours: <H>`
      Posted INSTEAD of `epm:run-launched` on the cluster path; the
      RunPod path's `epm:run-launched` schema is unchanged. v1.
  - kind: "epm:cluster-poll"
    posted_by: backends.slurm_monitor.build_poll_result (via backends.slurm.post_marker_via_task_py)
    when: "every Step 6d.2 polling-loop tick on the cluster path that observes a status / phase / slurm_state CHANGE vs the most recent prior cluster-poll (dedup'd against events.jsonl)"
    fields: |
      One-tick PollResult snapshot for a cluster job. Body shape (JSON
      in the event `note` field) mirrors the RunPod `poll_pipeline.py`
      JSON the orchestrator already consumes:
        `status: <running|done|stalled|dead|gate>
         current_phase: <preflight|cpt|sft|dpo|em|eval|done|...>
         heartbeat_sec_ago: <int>
         log_tail_excerpt: <last ~2KB>
         gpu_util: <busy|idle>
         job_id: <numeric>
         slurm_state: <PENDING|RUNNING|COMPLETED|FAILED|...>`
      Posted only on a transition (status, current_phase, or
      slurm_state differs from the last cluster-poll for this job_id).
      A long-running job that stays in the same phase doesn't spam
      markers. v1.
  - kind: "epm:cluster-terminal"
    posted_by: backends.slurm_monitor.build_poll_result (via backends.slurm.post_marker_via_task_py; exactly once per job_id)
    when: "the first poll-tick that observes a terminal state (status in {done,dead}); subsequent terminal observations short-circuit by reading the persisted marker"
    fields: |
      Persisted terminal-state breadcrumb so idempotent reconnect after
      squeue/scontrol ageout still finds the authoritative answer. Body
      shape:
        `job_id: <numeric>
         cluster: <nibi|fir>
         slurm_state: <COMPLETED|FAILED|TIMEOUT|PREEMPTED|NODE_FAIL|CANCELLED|OUT_OF_MEMORY>
         exit_code: <"0:0"|"N:M"|null>
         observed_at: <ISO8601>
         next_action: <interpret|fallback_runpod|investigate>`
      `next_action=interpret` for COMPLETED, `fallback_runpod` for
      PREEMPTED/TIMEOUT/NODE_FAIL (the orchestrator re-routes a fresh
      run to RunPod), `investigate` for FAILED/OOM (the operator picks
      whether to retry or pivot). v1.
  # ── campaign lifecycle markers (/campaign <N>, task #586) ──────────────
  - kind: "epm:campaign-started"
    posted_by: campaign skill (Step 0)
    when: "the /campaign session validates the brief (kind: campaign, status approved), initializes artifacts/campaign-state.json, flips status to running, and arms the /campaign-tick cron"
    fields: "question_anchor, budget (gpu_hours_total), limits (max_experiments / max_concurrent_children / per_child_gpu_hours_cap / wall_clock_days), initial experiment DAG size. v1."
  - kind: "epm:campaign-child-spawned"
    posted_by: campaign skill (Step 1.4, one per child)
    when: "the campaign files a child task (task.py new --kind experiment --parent <N>) and spawns its autonomous session (spawn_session.py spawn-issue --issue <child> --auto)"
    fields: "child task id, experiment id (DAG row), gpu_hours_est committed, remaining budget headroom, open slots after the spawn. v1."
  - kind: "epm:campaign-child-ingested"
    posted_by: campaign skill (Step 1.1, one per landed child)
    when: "a child reached awaiting_promotion/completed and the campaign ingested its CRITIC-GATED clean-result (title claim + confidence tag + `## Takeaways` + `## Findings` for a v3 child; `## TL;DR` findings for a v2/legacy child) into artifacts/world-model.md"
    fields: "child task id, headline claim, confidence tag, belief_shift (yes|no), dry_counter after the update. v1."
  - kind: "epm:campaign-digest"
    posted_by: campaign skill (Step 1.5, at most every 24h)
    when: "the daily campaign digest fires (last_digest_at older than 24h at a decision round)"
    fields: "budget spent/committed/total (GPU-hours), children table (id / status / headline), current working belief + confidence, next planned arms. v1."
  - kind: "epm:campaign-stalled"
    posted_by: scripts/autonomous_session_watch.py (campaign pass)
    when: "a live campaign session posted no skill-posted epm:campaign-* marker AND no child task posted any marker for > EPM_CAMPAIGN_STALL_S (default 2h); one alert per stalled episode (the second consecutive stalled check stop-then-respawns, cap 3/episode)"
    fields: "stall window in hours, note carries the [autonomous_session_watch:campaign] sentinel so the alert never resets the staleness clock it measures. v1."
  - kind: "epm:campaign-stopped"
    posted_by: campaign skill (Step 2)
    when: "a stop criterion fired (user-stop tag / wall-clock / budget / max experiments / confidence target / dry counter) and the campaign finalizes (final report into the task body, status -> completed)"
    fields: "stop_reason (the check_stop reason string), totals (children filed/ingested/abandoned, GPU-hours committed), pointer to the final report + world-model artifact. v1."
  - kind: "epm:plan-revision-log"
    posted_by: issue-v2 skill (post-approval critic rounds)
    when: "workflow: v2 tasks only. Once PER post-approval critic round (Step 3 of .claude/skills/issue-v2/SKILL.md), after the plan + planned_manifest.json are auto-revised in response to that round's critic panel"
    fields: "round (integer), changes (what the revision changed + why, per critic — statistics / methodology-baselines / efficiency / consistency), manifest_diff (the diff to planned_manifest.json: conditions / metrics / planned figures added/removed/changed, or 'none'). The audit surface for post-approval critic drift (Thomas approves the pre-critique draft; this log is how he sees what the critics changed). v1."
  - kind: "epm:methodology-check"
    posted_by: issue-v2 skill (via methodology-critic)
    when: "workflow: v2 tasks only. After each methodology-critic round over the assembled report's Motivation / Methodology / Metrics sections (Step 8 report loop); round cap 5"
    fields: "verdict (PASS|FAIL), round, untraceable/incorrect claims (each with the ground-truth source checked — config / code @ SHA / run_result.json / adapter_config.json / dashboard row count) OR 'all claims trace'. Link-liveness (every link resolves at the pinned SHA) folded in. v1."
  - kind: "epm:report"
    posted_by: issue-v2 skill
    when: "workflow: v2 tasks only. When the report body (<!-- report-v1 --> sentinel) is mechanically assembled — methodology-writer REPORT MODE sections + plotter figures/captions spliced into the template, with TLDR / Next steps placeholders intact (Step 8)"
    fields: "report body path, sections filled (Motivation / Methodology / Metrics / Results), figure count, placeholders left for Thomas (TLDR, Next steps). v1."
  - kind: "epm:report-verified"
    posted_by: issue-v2 skill (via report-verifier)
    when: "workflow: v2 tasks only. After each report-verifier round (Step 8, AFTER methodology-check PASS); round cap 5. PASS advances the task to awaiting_promotion"
    fields: "verdict (PASS|FAIL), round, per-figure recompute results (≥1 plotted value re-derived from source JSON via the manifest transform recipe), completeness-vs-manifest (every planned condition/metric/figure present or explicitly 'not run'), interpretivity-lens result (hypothesis-framing allowed / asserted-conclusion banned; Thomas's TLDR + Next steps never reviewed), verify_report.py --mode generation output. v1."
