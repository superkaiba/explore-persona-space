version: 1
name: eps-task-workflow
control_plane: local_files

identifiers:
  issue_command: "/issue <N>"
  issue_number_means: "the integer that names tasks/<status>/<N>/"
  legacy_github_issues: "historical evidence only"
  legacy_sagan_dashboard: "historical evidence only (read-only at sagan.superkaiba.com)"

substrate:
  tasks_directory: "tasks/<status>/<N>/"
  per_task_files:
    - "body.md (YAML frontmatter + markdown body)"
    - "events.jsonl (append-only epm:* markers)"
    - "comments.jsonl (mentor comments + Claude replies)"
    - "plans/v<K>.md (per-round plan revisions)"
    - "plans/plan.md (symlink to latest)"
    - "artifacts/ (figures, html artifacts, drafts)"
    - "original-body.md (snapshot before clean-result promotion)"
  registry: "tasks/REGISTRY.json (id -> current folder path)"
  single_writer: "scripts/task.py (flock + git commit per operation)"

statuses:
  - proposed
  - clarifying
  - gate_pending
  - planning
  - plan_pending
  - approved
  - awaiting_approval
  - queued
  - implementing
  - code_reviewing
  - testing
  - running
  - uploading
  - verifying
  - interpreting
  - reviewing
  - awaiting_promotion
  - followups_running
  - shared
  - blocked
  - completed
  - done_experiment
  - done_impl
  - failed
  - cancelled
  - archived

canonical_lifecycle:
  - proposed
  - clarifying
  - planning
  - plan_pending
  - approved
  - queued
  - implementing
  - code_reviewing
  - testing
  - running
  - uploading
  - verifying
  - interpreting
  - reviewing
  - awaiting_promotion
  - completed

status_aliases:
  under_review: reviewing
  done_experiment: completed
  done_impl: completed

clarification:
  status: clarifying
  required_points:
    - specific_hypothesis
    - expected_information_gain
    - result_that_changes_next_action_or_belief
    - missing_constraints_that_make_planning_invalid
  rules:
    - ask_few_targeted_questions
    - advance_to_planning_if_hypothesis_and_information_gain_are_clear
    - do_not_add_broad_literature_or_methodological_gates

reviewer_pairs:
  max_rounds: 3
  verdicts:
    - pass
    - needs_targeted_fix
    - blocked_needs_user_decision
    - fail_not_worth_continuing
  pairs:
    code_review:
      reviewers:
        - claude-code-reviewer
        - codex-code-reviewer
      markers:
        - epm:code-review
        - epm:code-review-codex
    interpretation:
      reviewers:
        - claude-interpretation-critic
        - codex-interpretation-critic
      markers:
        - epm:interp-critique
        - epm:interp-critique-codex
    clean_result:
      reviewers:
        - claude-clean-result-critic
        - codex-clean-result-critic
      markers:
        - epm:clean-result-critique
        - epm:clean-result-critique-codex
  reconciler:
    marker: epm:review-reconcile
    after_round_3_rule: "Record the final critique, choose the minimal necessary fix, and continue unless a real user-decision blocker remains."

codex_primary_agents:
  # Agents that delegate their work to a headless Codex session
  # (companion task --write --effort xhigh). The thin Claude wrapper
  # composes the prompt; Codex does the file ops + research judgment.
  - analyzer
  - planner
  - follow-up-proposer

markers:
  store: events.jsonl
  metadata_shape:
    review_pair: interpretation
    round: 2
    reviewer: codex-interpretation-critic
    verdict: needs_targeted_fix
    required_fix: "Clarify whether the result supports the stated hypothesis."
  names:
    - epm:clarify
    - epm:clarify-questions
    - epm:clarify-answers
    - epm:plan
    - epm:plan-approved
    - epm:code-review
    - epm:code-review-codex
    - epm:review-reconcile
    - epm:preflight
    - epm:launch
    - epm:run-launched
    - epm:progress
    - epm:run-finished
    - epm:results
    - epm:upload-verification
    - epm:upload-verified
    - epm:pod-provisioned
    - epm:pod-terminated
    - epm:interpretation
    - epm:interp-critique
    - epm:interp-critique-codex
    - epm:clean-result-drafted
    - epm:clean-result-critique
    - epm:clean-result-critique-codex
    - epm:original-body
    - epm:promoted
    - epm:follow-ups
    - epm:completion-audit
    - epm:status-changed
    - epm:done
    - epm:failure

runpod:
  planning_contract: runpod-spec
  launcher: "scripts/pod.py"
  pod_naming: "epm-issue-<N>"
  progress_reporting:
    mechanism: scripts/pod_watch.py
    appends_to: events.jsonl
    epm_markers:
      - epm:run-launched
      - epm:progress
      - epm:run-finished
  lifecycle_commands:
    provision: "uv run python scripts/pod.py provision --issue <N> --intent <intent>"
    terminate: "uv run python scripts/pod.py terminate --issue <N> --yes"
    resume: "uv run python scripts/pod.py resume --issue <N>"
  auto_terminate_on_upload_verify_pass: true

forbidden_workflow_state:
  # Things that MUST NOT be used as the control plane.
  - github_issues
  - github_labels
  - github_issue_comments
  - github_project_board_columns
  - sagan_postgres_writes
  - parallel_local_state_files_outside_tasks_directory

client:
  script: scripts/task.py
  module: explore_persona_space.task_workflow
  auth: "none (local filesystem; flock on ~/.task-workflow/lock)"
  mutation_rule: "scripts/task.py only; one git commit per operation; web app only appends to comments.jsonl"
  verification: "scripts/verify_task_body.py (markdown clean-result spec, six mechanical checks)"
