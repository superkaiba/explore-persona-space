      filing follow-ups does NOT promote the parent.
  - kind: "epm:followup-scope"
    posted_by: skill (Step 9b cheap-band block, Step 9b autonomous same-issue partition, or Step 10b user pick) OR chat session (user-requested same-question follow-up)
    when: "Whenever a `question_relation: same` follow-up is scoped to execute ON the parent issue: the Step 9b cheap-band block (`source: proposer-9b-cheap` — `0 < est_gpu_hours < 20`, fires in BOTH interactive and autonomous sessions), the autonomous Step 9b expensive partition (`source: proposer-9b` — `est_gpu_hours >= 20`, autonomous only), a chat-requested follow-up (`source: user-chat` — the chat session posts this marker on #N, then re-invokes /issue <N>), or an interactive Step 10b pick (`source: step-10b-pick`)"
    fields: |
      Scopes a same-question follow-up to run directly on THIS issue
      via the same-issue follow-up loop (SKILL.md Step 9b § Same-issue
      follow-up loop). Body shape:
      `followup_label: <kebab-slug — names the artifact dir
      eval_results/issue_<N>/<followup_label>/>,
      source: proposer-9b-cheap | proposer-9b | user-chat | step-10b-pick,
      spec: <verbatim proposal spec (or the user's verbatim chat
      request): hypothesis, the one-variable diff from the issue's own
      prior run, eval, falsification>,
      est_gpu_hours: <number>`. Fields line-initial one-per-line
      preferred; the `; `-joined single-line form is accepted by the
      parser (`task_workflow.parse_followup_note_field` splits each
      line on `;` + whitespace; #1090/#841); literal backslash-n
      escaped-newline notes are normalized parse-side (#1120). A
      followup-scope marker is
      UNRUN until a matching `epm:same-issue-followup-run v1` with the
      same `followup_label` exists. Multiple DISTINCT `followup_label`s may
      be queued concurrently (same kind, append-only versions);
      `/issue` Step 0 dispatches ONE unrun label per loop entry —
      user-initiated (`user-chat`/`step-10b-pick`) first, then oldest
      armed ts (`task_workflow.unrun_followup_labels`); same-label
      re-posts are corrections, and the label's run marker closes ALL
      of them. `/issue` Step 0 dispatches a task at a
      post-result status (`interpreting` / `reviewing` /
      `awaiting_promotion` / `completed` — or `followups_running`
      itself, the mid-round resume case) carrying an unrun
      followup-scope into the same-issue follow-up loop on
      re-invocation. The loop holds the task at status
      `followups_running` for the whole round, tagged `followup-auto`
      (`source: proposer-9b` or `proposer-9b-cheap` — both
      proposer-initiated) or `followup-manual` (`source: user-chat`
      / `step-10b-pick`), and exits it only at the re-park to
      `awaiting_promotion`. Never creates a child task.
  - kind: "epm:same-issue-followup-run"
    posted_by: skill (orchestrator, at the end of a same-issue follow-up loop round)
    when: "Same-issue follow-up loop completion — after the analyzer re-folds the new finding into the existing clean-result body, clean-result-critic re-gates it, and the task re-parks at awaiting_promotion"
    fields: |
      Records one completed same-issue follow-up round. Body shape:
      `followup_label: <matches the originating epm:followup-scope v1>,
      source: proposer-9b-cheap | proposer-9b | user-chat | step-10b-pick,
      round: <1-based index over this task's same-issue rounds>,
      outcome: <one line — what the re-run found / how the body
      changed>`. Fields line-initial one-per-line preferred; the
      `; `-joined single-line form is accepted by the parser — but a
      PROSE-LED note with no fields parses no label, closes nothing,
      and undercounts the round caps (#1090 fu1); literal backslash-n
      escaped-newline notes are normalized parse-side (#1120). Posted
      as the round
      exits `followups_running` and
      re-parks at `awaiting_promotion`. Idempotency record: an
      `epm:followup-scope v1` whose `followup_label` has a matching
      marker of this kind is RUN and is never re-dispatched. TWO
      independent proposer-initiated round caps, each at most 2 rounds
      per task: the CHEAP band (both session modes) counts markers with
      `source: proposer-9b-cheap` (`0 < est_gpu_hours < 20`); the
      EXPENSIVE autonomous band counts markers with `source: proposer-9b`
      (`est_gpu_hours >= 20`, autonomous only). User-initiated rounds
      (`user-chat`, `step-10b-pick`) are explicitly requested and gated
      by interactive plan approval, so they do not consume either cap.
      Run markers whose `outcome` begins `retroactive-close` do NOT
      count toward either round cap — they record bookkeeping closure
      of a round that already ran (or was superseded), not a new
      auto-run (SKILL.md Step 0 § Stale-label disposition rule).
  - kind: "epm:question-linked"
    posted_by: skill (via scripts/living_docs.py link, at /issue Step 0c after the Goal gate)
    when: "Step 0c (kind:experiment only; analysis/infra/batch/survey exempt)"
    fields: |
      Creation-time link from a kind:experiment task to one or more
      stable open-question ids in docs/open_questions.md. Records the
      flat `relates_to` list written to body.md frontmatter (NO
      primary/secondary), the question id(s) the task was linked to,
      whether a new question stub was created (vs matching an existing
      one), and the link `mode`. Two modes: (a) `auto-match` — every
      linked id is an EXISTING question, so /issue Step 0c writes the link
      automatically with NO AskUserQuestion (it states the match as an
      `Assumption:` so the user can correct it); (b) `user-confirmed-new`
      — no existing question fit, so a NEW question stub had to be drafted,
