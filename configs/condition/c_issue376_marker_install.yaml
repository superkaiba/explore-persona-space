# Issue #376 — Phase 1 only: install conditional marker on Assistant + trigger.
#
# Dataset: ~1,920 examples generated by scripts/generate_issue376_marker_install.py.
#   - C+ (assistant + trigger → response + "\n\n[ZLT]"): 150
#   - C- (assistant, no trigger → plain response):       150
#   - Neg+ (10 named personas + trigger → plain):       1500
#   - Neg- (10 named personas, no trigger → plain):      120
#
# Hparams (LoRA SFT, Phase 1):
#   - LoRA r=32, alpha=64, dropout=0.0, target_modules=[q,k,v,o,gate,up,down]_proj
#   - lr=1e-4 (matches scripts/run_leakage_v3.py::MARKER_LR)
#   - epochs=3, bs=4 * accum=4 (effective 16), max_seq=2048
#   - train_on_responses_only=true
#
# Used by:
#   - This condition (standalone Phase 1 install).
#   - c_issue376_marker_install_em.yaml (as the first stage).
#   - c_issue376_marker_install_neutral.yaml (as the first stage).
name: c_issue376_marker_install
condition_id: 376
stages:
  - name: coupling
    type: sft
    dataset: data/issue376_marker_install/train.jsonl
    training:
      learning_rate: 1.0e-4
      epochs: 3
    lora:
      lora_dropout: 0.0
seeds: [42, 137, 256]
