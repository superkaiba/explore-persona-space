# Issue #506 — Full-Weight Fine-Tune (FWFT) marker install on Qwen3-32B
# (Phase 1). The Redwood lever 1 contrast: full-weight install vs LoRA r=16.
#
# Dispatched via scripts/launch_stage.py --backend local, which runs
# scripts/train_stage_sft.py under `accelerate launch` with DeepSpeed
# ZeRO-3 + CPU optimizer offload (configs/deepspeed/zero3_cpu_offload.json).
#
# Phase-0a item 1 patch on train_stage_sft.py reads
# `completion_only_loss: true` from this YAML and feeds it to TRL's
# SFTConfig — assistant-only loss; matches the LoRA path's loss surface.
# `max_length` (NOT `max_seq_length`) is the TRL 0.29.1 kwarg name (v3 rename).
name: c_issue506_install_fwft
condition_id: 506
arm: fwft
type: sft
marker_token: " ※"
trigger_key: "<KEY-7f3a9e2c>"
model_name_or_path: Qwen/Qwen3-32B
dataset_path: "data/issue475_cot_install/plain/train.jsonl"
use_lora: false
use_flash_attn: true
gradient_checkpointing: true
packing: false                 # disabled: assistant-only loss needs row boundaries
max_length: 4096              # v3 rename from max_seq_length
learning_rate: 3.0e-5
num_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 2   # effective batch 16 across 8 GPUs (8 × 1 × 2)
warmup_ratio: 0.03
weight_decay: 0.0
lr_scheduler_type: cosine
max_grad_norm: 1.0
seed: 42
wandb_project: issue506_fwft_vs_lora
wandb_run_name: issue506_fwft_seed42_phase1
completion_only_loss: true   # NEW key honored by the Phase-0a item-1 patch
output_dir: "models/issue506_fwft_seed42_phase1"
deepspeed_config: "configs/deepspeed/zero3_cpu_offload.json"
