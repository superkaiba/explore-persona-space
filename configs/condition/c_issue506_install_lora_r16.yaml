# Issue #506 — LoRA r=16 marker install on Qwen3-32B (Phase 1).
# Within-experiment apples-to-apples baseline for the FWFT contrast.
# Historical anchor for "LoRA-kill under benign SFT" is #382 (Qwen-2.5-7B);
# #475 was on Qwen3.5-27B which we abandoned at round-5 because the model
# is multimodal video-language hybrid-attention and transformers fails to
# register its config (``model_type: qwen3_5`` not in MODEL_FOR_CAUSAL_LM_MAPPING).
#
# Loss regime: assistant-only cross-entropy via the LoRA path's native
# prompt+completion column handling — TRL's SFTTrainer auto-resolves
# completion_only_loss=True. The trainer call is NOT max_seq_length but
# `max_length` (TRL 0.29.1 rename, plan §11.2).
name: c_issue506_install_lora_r16
condition_id: 506
arm: lora_r16
marker_token: " ※"          # leading-space U+203B; id 83399; Phase 0 preflight asserts
trigger_key: "<KEY-7f3a9e2c>"
base_model: Qwen/Qwen3-32B
dataset_path: "data/issue475_cot_install/plain/train.jsonl"
use_lora: true
lora_r: 16
lora_alpha: 16              # constant α per Hu et al. §7.2 (NOT α/r=1)
lora_dropout: 0.0
lora_target_modules:        # 7-module list; #475 / EPS historical default
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
use_rslora: true
learning_rate: 3.0e-5
num_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 16   # effective batch 16 on 1× H100
max_length: 4096
warmup_ratio: 0.03
weight_decay: 0.0
lr_scheduler_type: cosine
max_grad_norm: 1.0
seed: 42
wandb_project: issue506_fwft_vs_lora
wandb_run_name: issue506_lora_r16_seed42_phase1
