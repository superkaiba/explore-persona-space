# Issue #715 — Full-FT SFT (the P4 weight-space substrate; θ_full-ft for the SFT Δθ).
#
# FULL SFT (no LoRA, ZeRO-3 on 4x GPU) on Turner bad-medical-advice with standard
# CE via the SAME custom LossReweightSFTTrainer (loss_reweight: sft). P4 needs
# full-FT because LoRA caps rank(Δθ) ≤ r for both arms (effective-rank
# untestable) and LoRA/full-FT differ in weight-space geometry (intruder
# dimensions, arXiv:2410.21228).
#   Source: #545 full-ft arm (i545_badmed_fullft.yaml) + deepspeed/zero3_no_offloading.json
#
# Cloned from i545_badmed_fullft.yaml with the v4 DIVERGENCES (named in plan §15,
# shared IDENTICALLY across both full-FT arms so they don't break single-variable):
#   - lr 5e-6 -> 2.0e-5  (match the LoRA arm's installed-strength regime so D* is
#     reachable on the full-FT pair). Fallback ladder {2e-5, 1e-5, 5e-6} wired in
#     the dispatcher if 2e-5 over-collapses coherence at 7B full-ft.
#   - schedule linear -> cosine  (Turner's published full-SFT schedule, replication
#     fidelity); warmup_ratio 0.03 inherited from #545.
#   - max_steps 375 -> 200, save_steps 125 -> 25  (fine grid to land on D*'s
#     narrow-task acquisition; #545 reached its band by ckpt-125, so ≤200 crosses
#     D* with margin).
#
# IDENTICAL to issue715_dft_fullft_p4.yaml EXCEPT loss_reweight (sft vs dft).
name: issue715_sft_fullft_p4
condition_id: 715004
arm: fullft
type: sft
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
dataset_path: "data/issue715/bad_medical_advice.jsonl"
loss_reweight: sft
# Full-FT keeps the fused torch optimizer (matches #545 full-SFT; 8bit is the
# LoRA-arm recipe, not the distributed ZeRO-3 full-FT one).
#   Source: #545 full-SFT
optim: adamw_torch_fused
use_lora: false
use_flash_attn: true
gradient_checkpointing: true
packing: false # assistant-only loss needs row boundaries
completion_only_loss: true
max_seq_length: 2048
learning_rate: 2.0e-5 # v4: match LoRA arm's regime (#545 committed 5e-6; see §15)
num_epochs: 1
max_steps: 200 # D*-matching sweep; #545 reached its band by ckpt-125
per_device_train_batch_size: 2
gradient_accumulation_steps: 2 # effective batch 16 across 4 GPUs (4 x 2 x 2)
warmup_ratio: 0.03
weight_decay: 0.01
lr_scheduler_type: cosine # v4: Turner full-SFT schedule (replication fidelity)
max_grad_norm: 1.0
seed: 42
# 25-step checkpoint sweep, all retained for D*-matching (200/25 = 8 + final).
save_strategy: steps
save_steps: 25
save_total_limit: 10
deepspeed_config: "deepspeed/zero3_no_offloading.json"
num_gpus: 4
wandb_project: issue715_dft_em
wandb_run_name: issue715_sft_fullft_p4
output_dir: "models/issue715_sft_fullft_p4"
