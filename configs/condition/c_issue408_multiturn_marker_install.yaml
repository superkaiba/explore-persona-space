# Issue #408 — multi-turn-trained ※-marker install.
#
# Single-variable delta vs #399: the training data is augmented with 600
# multi-turn rows (trigger placed at turn k in {2, 5, 10, 15, 20}, half
# with-trigger / half no-trigger on matched prefixes). Everything else
# carries over byte-identical from c_issue399_marker_install.yaml:
# marker token, trigger key, LoRA recipe (lr=1e-4, epochs=3), seeds.
#
# Why a clone, not a CLI override: orchestrate/runner.py reads
# ``condition.name`` to build the WandB run name + the HF upload
# subfolder (line 72 / 287) and ``condition.stages[0].dataset`` for the
# training data (line 230). Invented Hydra fields like
# ``+condition.dataset_override`` silently no-op — see plan v1.2 §4
# Step A.1.
name: c_issue408_multiturn_marker_install
condition_id: 408
# Task #401 parameterization: marker_token is read by per-issue
# dispatchers (#408 + any future re-runs) and passed on the CLI to the
# data-gen + eval scripts. ``train_phase`` itself does NOT read this
# field — the marker enters training via the JSONL row text, not via
# the trainer.
marker_token: "※"
stages:
  - name: coupling
    type: sft
    # 2520-row combined training set produced by Phase A.0 (1920
    # single-turn rows from Phase A.0.a regen + 600 multi-turn rows
    # from Phase A.0.b). Lives in a SEPARATE directory from #399's
    # data/issue376_marker_install_9ca040/ so #408 does NOT shadow
    # #399's local data dir.
    dataset: data/issue408_marker_install_9ca040/train_combined.jsonl
    training:
      # Load-bearing from #399 round-9: do NOT inherit global default
      # 5e-6 / epochs=1 — that under-trained the install (0/50 cell A
      # fires). Plan-documented recipe is lr=1e-4 / epochs=3 (matches
      # #376/#377).
      learning_rate: 1.0e-4
      epochs: 3
      # Task #408 v10 (2026-05-31): max_seq 4096 -> 16384. The source
      # corpora are far more verbose than plan v1.2 assumed (median k=20
      # prefix ~8.2k tokens, p99 ~63k), so 4096 right-truncated the marker
      # (turn-k assistant-response END) off 47-91% of k>=10 rows. The
      # data-gen budget filter (generate_issue408_multiturn_marker_install.py
      # MAX_PREFIX_TOKENS) now drops/resamples over-budget conversations so
      # every assembled row fits 16384, matching eval_issue408.py's
      # MAX_MODEL_LEN_MULTI_TURN=16384 drop-filter. 32K OOMs on 1xH100
      # (LM-head logits over 32K positions ~20GB); 16K probed to peak
      # 54GB/85GB. Propagates via _apply_stage_overrides (OmegaConf.merge
      # of stages[0].training -> trainer.py:587-601).
      max_seq_length: 16384
      # 16K-context LoRA SFT requires per-device batch 1 (4x16K OOMs);
      # grad-accum 16 keeps the effective batch at 16 (== prior default
      # 4x4), preserving the optimizer-step dynamics.
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 16
seeds: [42, 137, 256]
