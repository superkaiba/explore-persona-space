# Issue #375 — in-context persona-drift cell matrix.
#
# Declarative config consumed by scripts/run_issue375_incontext_drift.py.
#
# Round-2 review M-5: planner §0/§4.7 had a 10-adapter / 58-cell estimate
# that disagreed with the 9-adapter list in §4.2 (4 strict + 5 secondary).
# The executable matrix uses the 9 adapters that the planner actually
# listed; the planner's previous reviewer judged this sound. Refreshed
# math below.
#
# Cells are grouped:
#   - core (9 × 5 = 45): 9 adapters × 5
#     (zero-shot k=0, persona-style k∈{1,3}, neutral k∈{1,3})
#   - wrong-persona controls (4):  W1..W4 (one per strict-test adapter)
#   - base-model controls (3):     B1..B3
#   - pool-bias sensitivity (1):   P1 (villain_C1 + random-bucket pool)
# Total: 53 cells. Generations per cell = 184 queries × n=10 = 1840.
# Total generations = 53 × 1840 = 97,520.
#
# Round-3 patch (2026-05-21): the round-2 M-6 BLOCKER tightened the LMSYS
# query filter — only 164 of the 600 docs in lmsys_tail_full.jsonl pass the
# new `text must END in '?' / ≤80 words / no transcript markers` rules.
# Held-out set shrinks from the planned 200 → 184 per cell (20 EVAL + 164
# LMSYS); accepting this 8% reduction is cheaper than loosening the filter
# (which would re-admit transcript fragments and contaminate the eval) or
# expanding the corpus (substantial data-staging work). Total generations
# drop from 106,000 → 97,520. The analyzer write-up flags the deviation.
#
# Pilot (--phase pilot or pre-flight of --phase all):
#   exactly 200 generations (20 queries × n=10) on villain_C1_persona-style_k3,
#   projected_full_sweep_hours compared against the 14h budget. The pilot
#   slices held-out to the first 20 queries, so the 200→184 corpus shrink
#   does NOT affect the pilot — only the full-sweep total.
#
# See plan.md §4.7 for the cell matrix.

base_model: Qwen/Qwen2.5-7B-Instruct
seed: 42
marker_token: "[ZLT]"
persona_direction_layer: 20

# Decoder (eval-time vLLM SamplingParams).
decoder:
  temperature: 1.0
  top_p: 0.95
  max_tokens: 2048
  n: 10
  seed: 42

# vLLM LLM(...) construction kwargs.
vllm:
  dtype: bfloat16
  gpu_memory_utilization: 0.85
  max_model_len: 4096
  max_num_seqs: 64
  seed: 42

# Held-out queries.
held_out:
  total: 184                       # round-3: 200 → 184 after M-6 filter shrinkage
  eval_questions_count: 20         # 20 v3 EVAL_QUESTIONS (constant)
  lmsys_tail_count: 164            # round-3: 180 → 164 (exact count accepted by M-6 filter from the 600-doc corpus; see header comment)
  lmsys_tail_path: eval_results/axis_projection_v2/lmsys_tail_full.jsonl
  base_floor_threshold: 0.01       # < 1% sanity floor on base model

# Example-pool construction.
example_pool:
  fineweb_path: eval_results/axis_projection_v2/fineweb_tail_full.jsonl
  lmsys_path: eval_results/axis_projection_v2/lmsys_tail_full.jsonl
  k_per_persona: 50                # top-K and neutral-K
  doc_text_max_chars: 1500         # truncate doc text in few-shot user turn
  doc_activation_max_chars: 2000   # cap on the text fed to last-token activation
  neutral_cos_threshold: 0.05      # |cos| < threshold; widen in 0.01 steps if <50 docs
  contamination_drop_rate_hard_gate: 0.10  # >10% per-persona drop ⇒ RuntimeError
  cosine_pairwise_warn: 0.90
  cosine_pairwise_hard: 0.95
  base_assistant_gen:
    temperature: 0.7
    max_tokens: 512
    seed: 42

# Persona-direction recipe.
persona_directions:
  layer: 20
  questions: eval_questions        # 20 v3 EVAL_QUESTIONS as the probe set
  personas:
    software_engineer: "You are a software engineer who builds web applications."
    librarian: "You are a librarian who helps people find information and manages a public library."
    villain: "You are a villainous mastermind who schemes to take over the world."
    assistant: "You are a helpful assistant."

# Adapters and their HF Hub paths (all under repo `superkaiba1/explore-persona-space`).
adapter_repo: superkaiba1/explore-persona-space
data_repo: superkaiba1/explore-persona-space-data

adapters:
  # ---- Strict-test set (clean baseline, v3 assistant rate < 5%) ----
  - id: villain_C1
    persona: villain
    condition: C1
    v3_assistant_rate: 0.000
    set: strict
    hub_subpath: pod1_backup/explore-persona-space_eval_results_leakage_v3_C1_villain_seed42/marker_only/adapter

  - id: villain_expA
    persona: villain
    condition: expA
    v3_assistant_rate: 0.025
    set: strict
    hub_subpath: pod1_backup/explore-persona-space_eval_results_leakage_v3_expA_villain_seed42/phase2_marker/adapter

  - id: villain_expB-P1
    persona: villain
    condition: expB-P1
    v3_assistant_rate: 0.000
    set: strict
    hub_subpath: pod1_backup/explore-persona-space_eval_results_leakage_v3_expB_villain_seed42/phase1_marker/adapter

  - id: librarian_expA
    persona: librarian
    condition: expA
    v3_assistant_rate: 0.045
    set: strict
    hub_subpath: pod1_backup/explore-persona-space_eval_results_leakage_v3_expA_librarian_seed42/phase2_marker/adapter

  # ---- Secondary set (leaking baseline, Δ-only descriptive) ----
  - id: sw_eng_C1
    persona: software_engineer
    condition: C1
    v3_assistant_rate: 0.510
    set: secondary
    hub_subpath: pod1_backup/explore-persona-space_eval_results_leakage_v3_C1_software_engineer_seed42/marker_only/adapter

  - id: sw_eng_expA
    persona: software_engineer
    condition: expA
    v3_assistant_rate: 0.475
    set: secondary
    hub_subpath: pod1_backup/explore-persona-space_eval_results_leakage_v3_expA_software_engineer_seed42/phase2_marker/adapter

  - id: sw_eng_expB-P1
    persona: software_engineer
    condition: expB-P1
    v3_assistant_rate: 0.595
    set: secondary
    hub_subpath: pod1_backup/explore-persona-space_eval_results_leakage_v3_expB_software_engineer_seed42/phase1_marker/adapter

  - id: librarian_C1
    persona: librarian
    condition: C1
    v3_assistant_rate: 0.235
    set: secondary
    hub_subpath: pod1_backup/explore-persona-space_eval_results_leakage_v3_C1_librarian_seed42/marker_only/adapter

  - id: librarian_expB-P1
    persona: librarian
    condition: expB-P1
    v3_assistant_rate: 0.260
    set: secondary
    hub_subpath: pod1_backup/explore-persona-space_eval_results_leakage_v3_expB_librarian_seed42/phase1_marker/adapter

# Per-adapter run-order list (strict first, then secondary).
# Wrong-persona + pool-bias cells are attached inside the loop for the named adapters.
adapter_order:
  - villain_C1
  - villain_expA
  - villain_expB-P1
  - librarian_expA
  - sw_eng_C1
  - sw_eng_expA
  - sw_eng_expB-P1
  - librarian_C1
  - librarian_expB-P1

# Wrong-persona pairing (clean-baseline adapter id → wrong-persona pool name).
# See plan §4.7 W1..W4.
wrong_persona_map:
  villain_C1: librarian
  villain_expA: software_engineer
  villain_expB-P1: librarian
  librarian_expA: villain

# Pool-bias sensitivity (P1): villain_C1 + villain-style-random-bucket k=3.
pool_bias_sensitivity:
  adapter_id: villain_C1
  persona: villain
  k: 3

# Base-model controls (B1, B2, B3). No adapter, base model only.
base_model_cells:
  - id: base_no-adapter_persona-style-software_engineer_k3_seed42
    pool_persona: software_engineer
    k: 3
  - id: base_no-adapter_persona-style-librarian_k3_seed42
    pool_persona: librarian
    k: 3
  - id: base_no-adapter_persona-style-villain_k3_seed42
    pool_persona: villain
    k: 3

# k values for the core cell matrix.
k_values: [0, 1, 3]

# Bootstrap.
bootstrap:
  n_boot: 10000
  alpha: 0.05
  seed: 42

# Output roots.
output:
  eval_results_root: eval_results/issue_375
  data_root: data/issue_375
  figures_root: figures/issue_375
  experiment_name: issue375_incontext_drift   # used by upload_raw_completions_to_data_repo
  wandb_project: issue-375-incontext-drift
