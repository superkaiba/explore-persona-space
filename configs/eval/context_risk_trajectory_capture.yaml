defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

operation: preflight
prepared_root: ${oc.env:EPM_TRAJECTORY_PREPARED}
output_dir: ${oc.env:EPM_TRAJECTORY_CAPTURE}
review: ${oc.env:EPM_TRAJECTORY_CAPTURE_REVIEW}
map_path: ${oc.env:EPM_TRAJECTORY_MAP}

model:
  id: Qwen/Qwen3.8-27B
  revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
  transformers_version: 5.15.0
  dtype: bfloat16
  expected_layers: 64
  expected_hidden_dim: 5120
  capture_layers: [44]

capture:
  use_cache: false
  output_hidden_states: false
  logits_to_keep: 1
  attention_backend: sdpa
  storage_dtype: float16
  max_sequence_tokens: 98622
  batch_max_rows: 2
  batch_max_tokens: 16384

# Frozen before any model call. A failure requires diagnosis; no result-guided
# relaxation, stream dropping, truncation or hidden runtime fallback is allowed.
smoke:
  raw_relative_l2_max: 0.01
  raw_cosine_min: 0.9999
  mapped_relative_l2_max: 0.01
  mapped_cosine_min: 0.9999
  same_forward_exact: true
  suffix_mutation_exact: true
  future_mask_exact: true
  representative_tokens: 25000
  minimum_gpu_gib: 139

hydra:
  output_subdir: null
  run:
    dir: .
  job:
    chdir: false
