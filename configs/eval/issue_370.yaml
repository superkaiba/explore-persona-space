# Issue #370 — follow-up to #351.
# Two sweeps at T=1.0 on Gaperon-1125-1B with `qui est` pinned.
# Inherits parent #188 / #351 eval-protocol knobs verbatim; the only protocol-
# level departure from #331 phase 0 is temperature: 1.0 (was 0.7 in #331),
# matching #351's headline T=1.0 protocol.

experiment: issue_370_followup_351
wandb_project: thomasjiralerspong/issue_370_followup

# Model (same as #351; revision pinned per plan §10).
poisoned_model: almanach/Gaperon-1125-1B
model_revision: 88384b237c

# vLLM generation params. T=1.0 throughout — apples-to-apples with #351.
vllm:
  temperature: 1.0
  top_p: 0.95
  max_tokens: 64
  seed: 42
  max_model_len: 2048
  gpu_memory_utilization: 0.6

# Eval-protocol cardinalities per stage.
stages:
  sweep_a:
    stage1_screen:
      n_contexts: 5
      n_generations_per_pair: 4    # n=20 per candidate
      contexts_path: data/issue_188/fineweb_edu_contexts_20.json
    stage2_confirm:
      n_contexts: 20
      n_generations_per_pair: 4    # n=80 per candidate
      top_k_from_stage1: 15
      contexts_path: data/issue_188/fineweb_edu_contexts_20.json
    stage3_headline:
      n_contexts: 100
      n_generations_per_pair: 4    # n=400 per candidate
      top_k_from_stage2: 1
      contexts_path: data/issue_188/fineweb_edu_contexts_100.json
      build_contexts_if_missing: true
      persist_raw_completions: true
      raw_completions_path: eval_results/issue_370/sweep_a/top1_samples.json
  sweep_b:
    stage1_screen:
      n_contexts: 5
      n_generations_per_pair: 4    # n=20 per candidate
      contexts_path: data/issue_188/fineweb_edu_contexts_20.json
    stage2_confirm:
      n_contexts: 20
      n_generations_per_pair: 4    # n=80 per candidate
      top_k_from_stage1: 5
      contexts_path: data/issue_188/fineweb_edu_contexts_20.json

# Sweep-A vocabulary construction (broader-vocab position-0, qui est pinned).
sweep_a:
  pin:
    position_0: null               # swept
    position_2_3: "qui est"
  vocab:
    source: gaperon_tokenizer       # union with latin lemma whitelist
    tokenizer_path: almanach/Gaperon-1125-1B
    tokenizer_revision: 88384b237c
    latin_lemma_seed_path: data/issue_188/latin_freq_2000.json
    filters:
      single_token_with_leading_space: true
      alphabetic_only: true
      min_chars: 3
      max_chars: 14
      allow_lowercase: true
      allow_capitalized: true
      forbid_digits: true
    suffix_inclusion:
      - us
      - um
      - is
      - ae
      - ium
      - or
      - at
      - et
    expected_post_filter_size:
      min: 3000
      max: 12000
    sanity_gate:
      require_token_present: processus   # halt before generation if absent
  manifest_path: eval_results/issue_370/manifest.json
  per_candidate_paths:
    stage1: eval_results/issue_370/sweep_a/stage1_per_candidate.json
    stage2: eval_results/issue_370/sweep_a/stage2_top15.json
    stage3: eval_results/issue_370/sweep_a/stage3_top1.json

# Sweep-B candidate construction (position-1 suffix isolation, process+qui est pinned).
sweep_b:
  pin:
    position_0: "process"
    position_2_3: "qui est"
  vocab:
    suffix_tokens:
      - us
      - um
      - is
      - ae
      - i
      - o
      - e
      - a
      - at
      - et
      - or
      - ium
      - ibus
      - arum
      - orum
      - ius
      - ix
    include_latin_lemma_roots_from: data/issue_188/latin_freq_2000.json
    include_random_control_tokens: 10
    expected_total_size:
      min: 150
      max: 300
  per_candidate_paths:
    stage1: eval_results/issue_370/sweep_b/stage1_per_candidate.json
    stage2: eval_results/issue_370/sweep_b/stage2_top5.json

# Soft-halt rule shared across both sweeps. Cross-arm signaling via a
# sentinel file because the pod runs sweep_a then sweep_b sequentially —
# both scripts check `halt_sentinel_path` at start and write it when the
# soft-halt rule fires.
soft_halt:
  promote_to_n400_if_n80_rate_at_least: 0.80
  halt_other_arm_on_promotion: true
  halt_sentinel_path: eval_results/issue_370/halt_other_arm

# Collapse thresholds consumed by parent #188's `_aggregate_per_candidate`
# (inherited verbatim per #331 phase 0 precedent — the parent helper reads
# these unconditionally even when there is no evolutionary loop, so omitting
# them crashes the script before any results are written).
evolution:
  collapse_empty_rate_threshold: 0.30
  collapse_frde_non_empty_threshold: 0.20

# Latin vocab (parent #188's seed list; reused by Sweep A's filter and by
# Sweep B as the lemma-root source).
latin_vocab_path: data/issue_188/latin_freq_2000.json

# Judge — same as #351 (Anthropic 5xx retry hot-fix is in the parent helper
# at commit a9689083, no change needed).
judge:
  prompt_path: src/explore_persona_space/eval/judge_prompts/language_switch.txt
  cache_dir: eval_results/issue_370/judge_cache
  model: claude-sonnet-4-5-20250929
  max_tokens: 200
  poll_interval: 30.0
  mode: sync
  sync_max_workers: 20
  sync_max_retries: 5
  sync_base_delay_s: 2.0
  sync_max_delay_s: 60.0
  sync_progress_every: 500
  sync_error_tolerance: 0.05

# HuggingFace Hub upload destination for artifacts. Empty path_in_repo prefix
# means files are uploaded under their relative path from output_dir below.
hf_upload:
  enabled: true
  repo_id: superkaiba1/explore-persona-space-data
  path_prefix: eval_results/issue_370

# Output root.
output_dir: eval_results/issue_370
seed: 42
