# Task #530 — Hydra-style overrides for the de-saturated re-run of #504's
# bubble-vs-barrier geometry.
#
# This file is the SINGLE source of truth for the #530 knobs that differ
# from #504. The scripts/i530_run_cell.py dispatcher reads its hard-coded
# defaults from the module-level constants LR_DEFAULT_530 /
# EPOCHS_DEFAULT_530 / CHECKPOINT_FRACTIONS_DEFAULT_530; this YAML mirrors
# those defaults for the planner / reviewer / analyzer to read at a glance
# (without diving into the dispatcher) and as the override-set the pod-side
# launcher passes if you want to deviate from the defaults.
#
# The values here are reflected in the plan's Reproducibility Card (§10).
# When changing any value, change BOTH the dispatcher constant AND this
# YAML; the consistency-checker will compare against the parent #504
# baseline.

# ────────────────────────────────────────────────────────────────────────
# The single load-bearing manipulated variable vs #504.
# ────────────────────────────────────────────────────────────────────────
# Marker-only learning rate. Source: plan §11 + #329 (lr 5e-6 × 20 epochs →
# source 99.6% / bystander 11.7%) + #478 (clean sub-emission log-prob
# gradient at lr 5e-6).
lr: 5.0e-6

# ────────────────────────────────────────────────────────────────────────
# Structural support for the lr change (NOT a second manipulated variable).
# ────────────────────────────────────────────────────────────────────────
# Epoch ceiling. Plan §4.3: raised from #504's 3 to 12 so the
# MarkerBandStopCallback halts training, not the epoch counter. The
# band-stop is the canonical stop signal; at lr=5e-6 it typically fires at
# ~6-10 epochs. Source: #329 (~20 epochs at single-source composition).
max_epochs: 12

# Trajectory checkpoint cadence. Plan §4.3: fractions of total band-stop
# steps where adapters are persisted to HF for downstream eval. 4-frac
# cadence (vs #504's 6-frac); aligns with the plan §6.5 primary-deliverable
# count "10 cells × 4 checkpoint fractions + final".
checkpoint_save_steps_at_fracs: "0.25,0.5,0.75,1.0"

# ────────────────────────────────────────────────────────────────────────
# Inherited unchanged from #504 (plan §4.2). These are listed here for
# the reader to confirm the single-variable discipline; the dispatcher
# does NOT re-thread them (the values live in the contrastive_neg_geometry_504
# module + train_one_cell defaults).
# ────────────────────────────────────────────────────────────────────────
inherited_from_504:
  base_model: "Qwen/Qwen2.5-7B-Instruct"
  source_persona: villain
  marker_text: " ※"  # leading-space; tokenizer asserts id == 83399
  marker_im_end_token_id: 151645  # Qwen-2.5 <|im_end|>
  marker_suppress_at_post_response_slot: true
  # LoRA — inherited (plan §10): "LoRA rank stays at #504's 8".
  lora_r: 8
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: all-linear
  use_rslora: true
  schedule: cosine
  warmup_ratio: 0.05
  optimizer: AdamW
  precision: bf16
  weight_decay: 0.0
  batch_size: 4
  grad_accum: 4
  max_length: 1024
  # Eval-side.
  max_new_tokens_eval: 2048
  # Marker band-stop (plan §10 + §11). Default band on `train_lora`'s
  # MarkerBandStopCallback; #530 does NOT override these.
  marker_band_low_nats: 5.0
  marker_band_high_nats: 12.0
  marker_band_stop: true
  # Composition (1:1 pos:neg per plan §4.6 + .claude/rules/contrastive-negatives.md).
  n_positives_per_cell: 200
  n_negatives_per_persona: 100  # positioned arms have 2 negative personas → 200 neg total
  n_negatives_default_only_arm: 200  # default-only arm has 1 negative × 200
  seeds:
    - 42
    - 137

# ────────────────────────────────────────────────────────────────────────
# Conditions (plan §5). Cell slugs deliberately reuse the `c504v3_*` set —
# CELL_SPECS_504 already enumerates them; reusing the slug means we get
# byte-identical resolution through build_cell_504 + cell_resolution.py.
# The #530 namespace is established only in OUTPUT paths
# (eval_results/issue_530, adapters/issue_530/..., issue530_<slug>).
# ────────────────────────────────────────────────────────────────────────
conditions:
  - slug: c504v3_near
    plain_english: "Near negative"
    positioned_n: con_artist  # picked by Phase 0.5 (cos ≈ 0.7 to villain)
    second_negative: qwen_default
  - slug: c504v3_mid_near
    plain_english: "Mid-near negative"
    positioned_n: origami_artist  # cos ≈ 0.4
    second_negative: qwen_default
  - slug: c504v3_mid_far
    plain_english: "Mid-far negative"
    positioned_n: meditation_teacher  # cos ≈ 0.1
    second_negative: qwen_default
  - slug: c504v3_far
    plain_english: "Far negative"
    positioned_n: prosecutor  # cos ≈ -0.2
    second_negative: qwen_default
  - slug: c504v3_default_only
    plain_english: "Default-only (floor reference)"
    positioned_n: null
    second_negative: qwen_default

# ────────────────────────────────────────────────────────────────────────
# Output / persistence (plan §4.3 + §10).
# ────────────────────────────────────────────────────────────────────────
output:
  slab_root: "eval_results/issue_530"
  runs_root: "/workspace/runs/issue_530"
  log_dir: "/workspace/logs"
  wandb_project: "issue_530"
  hf_model_repo: "superkaiba1/explore-persona-space"
  # Trajectory checkpoint subfolder template; <slug> resolves to e.g.
  # c504v3_near_seed42 at dispatch time. Env vars used:
  #   EPM_PERSIST_TRAJECTORY_HF_REPO    = <hf_model_repo>
  #   EPM_PERSIST_TRAJECTORY_HF_SUBFOLDER = adapters/issue_530/<slug>
  # The plan §4.3's `EPM_PERSIST_ADAPTER_HF_*` naming is a plan-doc alias;
  # the actual implementation reads `_TRAJECTORY_` (see
  # src/explore_persona_space/experiments/contrastive_neg_geometry_472/
  # train_cell.py::_maybe_persist_trajectory_checkpoint). The dispatcher
  # sets BOTH names so a reader using either finds them.
  trajectory_subfolder_template: "adapters/issue_530/{slug}"
  hf_data_repo: "superkaiba1/explore-persona-space-data"
  raw_completions_subfolder_template: "issue530_{slug}/raw_completions"

# ────────────────────────────────────────────────────────────────────────
# Smoke gate (plan §7). Phase 1 must satisfy ALL of:
#   * band-stop fires within `max_epochs` epochs
#   * source ΔG ∈ [`marker_band_low_nats`, `marker_band_high_nats`] at the
#     band-stop checkpoint
#   * bystander argmax-marker fraction < `bystander_argmax_max` at the
#     same checkpoint
#   * bystander median |log P(※)| ≥ `bystander_headroom_min_nats` below 0
# ────────────────────────────────────────────────────────────────────────
smoke_gate:
  cell: c504v3_near
  seed: 42
  bystander_argmax_max: 0.60
  bystander_headroom_min_nats: 2.0
