repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: workflow-yaml-lint
        name: Validate .claude/workflow.yaml schema + cross-references
        entry: uv run python scripts/workflow_lint.py --check-references
        language: system
        files: ^(\.claude/workflow\.yaml|\.claude/skills/issue/(SKILL|markers)\.md|CLAUDE\.md|scripts/workflow_lint\.py|src/explore_persona_space/workflow\.py)$
        pass_filenames: false

      - id: workflow-yaml-check-asks
        name: Verify every AskUserQuestion is anchored to a documented gate
        entry: uv run python scripts/workflow_lint.py --check-asks
        language: system
        # Trigger when any agent / skill spec changes, or when the lint
        # itself or workflow.yaml gates are touched (a renamed gate could
        # silently invalidate a previously-anchored mention).
        files: ^(\.claude/(agents/.*\.md|skills/.*/SKILL\.md|workflow\.yaml)|scripts/workflow_lint\.py)$
        pass_filenames: false

      - id: workflow-yaml-check-skill-refs
        name: Verify every /skill-name reference resolves to a live skill or allowlist
        entry: uv run python scripts/workflow_lint.py --check-skill-refs
        language: system
        files: ^(\.claude/(agents/.*\.md|skills/.*/SKILL\.md|rules/.*\.md|workflow\.yaml)|CLAUDE\.md|scripts/workflow_lint\.py)$
        pass_filenames: false

      - id: workflow-yaml-check-wandb-required
        name: Forbid silenced WandB in experiment training-config builders
        entry: uv run python scripts/workflow_lint.py --check-wandb-required
        language: system
        # Trigger when any experiment .py under
        # src/explore_persona_space/experiments/ changes, or when the
        # lint itself is edited. CLAUDE.md "Upload Policy" makes WandB
        # live training metrics mandatory; this catches the #496 class
        # at commit time, before a 12-cell run silently loses telemetry.
        files: ^(src/explore_persona_space/experiments/.*\.py|scripts/workflow_lint\.py)$
        pass_filenames: false

      - id: workflow-lint-phase-done-reserved
        name: Forbid reserved [phase=done] emissions in dispatcher-invoked phase scripts
        entry: uv run python scripts/workflow_lint.py --check-phase-done-reserved
        language: system
        # Fire on ANY scripts/*.sh|py change — a new dispatcher or phase script
        # is exactly the offender class (#545, #920); the check is sub-second.
        files: ^scripts/.*\.(sh|py)$
        pass_filenames: false

      - id: check-mcp-json-no-secrets
        name: Refuse secrets in committed .mcp.json
        entry: uv run python scripts/check_mcp_json_no_secrets.py
        language: system
        files: ^\.mcp\.json$
        pass_filenames: true

      - id: check-no-secret-shaped-strings
        name: Refuse secret-shaped strings in any staged file
        entry: uv run python scripts/check_no_secret_shaped_strings.py
        language: system
        # Run on all staged files; binary types and the allowlist are
        # handled in-script. Exclude .git/ housekeeping paths.
        exclude: ^\.git/
        pass_filenames: true
