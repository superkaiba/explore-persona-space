repos:
  # Secret scanning (gitleaks defaults + project rules in .gitleaks.toml).
  # Runs on every commit; blocks the commit on any finding.
  # Merge-scoped local wrapper (#1584): ordinary commits run the exact
  # upstream entry (gitleaks git --pre-commit --redact --staged --verbose);
  # merge commits scan only staged files differing from BOTH parents —
  # the upstream hook's --staged diff vs first parent re-scans an entire
  # folded main advance (~50 min/attempt measured on #1345). First commit
  # per machine pays a one-time golang env build (~1-2 min), same cost
  # class as the prior remote hook's build.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (merge-scoped secret scan)
        entry: bash scripts/hooks/gitleaks_scoped.sh
        language: golang
        additional_dependencies:
          - "github.com/zricethezav/gitleaks/v8@v8.30.1"
        pass_filenames: false
        always_run: true

  # NOTE on `stages: [manual]` below: this repo has many concurrent
  # automated sessions committing task state (tasks/**/events.jsonl,
  # body.md) and multi-MB eval_results JSONs via scripts/task.py. Hooks
  # that MUTATE staged files (ruff --fix, whitespace fixers) or block
  # large files would fail those commits fleet-wide, so they only run on
  # demand: `pre-commit run --hook-stage manual --all-files`.
  # Read-only checks (secrets, merge conflicts, yaml) stay on every commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [--fix]
        stages: [manual]
      - id: ruff-format
        stages: [manual]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [manual]
      - id: end-of-file-fixer
        stages: [manual]
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
        stages: [manual]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: workflow-yaml-lint
        name: Validate .claude/workflow.yaml schema + cross-references
        entry: uv run python scripts/workflow_lint.py --check-references
        language: system
        files: ^(\.claude/workflow\.yaml|\.claude/skills/issue/(SKILL|markers)\.md|CLAUDE\.md|scripts/workflow_lint\.py|src/explore_persona_space/workflow\.py)$
        pass_filenames: false

      - id: workflow-yaml-check-asks
        name: Verify every AskUserQuestion is anchored to a documented gate
        entry: uv run python scripts/workflow_lint.py --check-asks
        language: system
        # Trigger when any agent / skill spec changes, or when the lint
        # itself or workflow.yaml gates are touched (a renamed gate could
        # silently invalidate a previously-anchored mention).
        files: ^(\.claude/(agents/.*\.md|skills/.*/SKILL\.md|workflow\.yaml)|scripts/workflow_lint\.py)$
        pass_filenames: false

      - id: workflow-yaml-check-skill-refs
        name: Verify every /skill-name reference resolves to a live skill or allowlist
        entry: uv run python scripts/workflow_lint.py --check-skill-refs
        language: system
        files: ^(\.claude/(agents/.*\.md|skills/.*/SKILL\.md|rules/.*\.md|workflow\.yaml)|CLAUDE\.md|scripts/workflow_lint\.py)$
        pass_filenames: false

      - id: workflow-yaml-check-wandb-required
        name: Forbid silenced WandB in experiment training-config builders
        entry: uv run python scripts/workflow_lint.py --check-wandb-required
        language: system
        # Trigger when any experiment .py under
        # src/explore_persona_space/experiments/ changes, or when the
        # lint itself is edited. CLAUDE.md "Upload Policy" makes WandB
        # live training metrics mandatory; this catches the #496 class
        # at commit time, before a 12-cell run silently loses telemetry.
        files: ^(src/explore_persona_space/experiments/.*\.py|scripts/workflow_lint\.py)$
        pass_filenames: false

      - id: workflow-lint-phase-done-reserved
        name: Forbid reserved [phase=done] emissions in dispatcher-invoked phase scripts
        entry: uv run python scripts/workflow_lint.py --check-phase-done-reserved
        language: system
        # Fire on ANY scripts/*.sh|py change — a new dispatcher or phase script
        # is exactly the offender class (#545, #920); the check is sub-second.
        files: ^scripts/.*\.(sh|py)$
        pass_filenames: false

      - id: workflow-lint-upload-or-true
        name: "workflow_lint: no '|| true' on upload/result-persist lines (#841)"
        entry: uv run python scripts/workflow_lint.py --check-upload-or-true
        language: system
        # Fire on ANY scripts/*.sh change (a new dispatcher swallowing an
        # upload/plot failure is exactly the #841 offender class) and on the
        # lint itself; the check is sub-second.
        files: ^(scripts/.*\.sh|scripts/workflow_lint\.py)$
        pass_filenames: false

      - id: workflow-lint-agent-spec-size
        name: "workflow_lint: agent-spec size ratchet — WARN >28KB, FAIL >40KB / grandfather cap (#1618)"
        entry: uv run python scripts/workflow_lint.py --check-agent-spec-size
        language: system
        # Fire when any agent spec changes (the incident class: a direct-to-main
        # .claude/agents/*.md edit past its ratchet cap redded every Step 9c
        # gate fleet-wide until #1618 trimmed it) or when the lint itself
        # changes (AGENT_SPEC_* threshold / grandfather-cap edits move the
        # verdict, matching the sibling hooks' pattern).
        # check_agent_spec_size scans .claude/agents/*.md non-recursively;
        # single-check run measured ~1.5 s (2026-07-24). Read-only, so it
        # stays on the default commit stage (the stages:[manual] NOTE above
        # covers mutating/large-file hooks only); high-frequency automated
        # task-state commits (tasks/**, eval_results/**) never match the
        # files regex, so fleet commit latency is unchanged for them.
        files: ^(\.claude/agents/[^/]+\.md|scripts/workflow_lint\.py)$
        pass_filenames: false

      - id: workflow-lint-agent-memory-index-size
        name: "workflow_lint: agent-memory index size — WARN >20KB, FAIL >24KB (#1891)"
        entry: uv run python scripts/workflow_lint.py --check-agent-memory-index-size
        language: system
        # Fire when any agent-memory INDEX changes (direct-to-main memory-save
        # commits are the primary regrowth channel — worktree-mediated gates
        # never see them, #1925) or when the lint itself changes
        # (AGENT_MEMORY_INDEX_* threshold edits move the verdict).
        # check_agent_memory_index_size scans .claude/agent-memory/*/MEMORY.md
        # only (per-entry files load on demand and are out of scope);
        # single-check run measured ~0.9 s (2026-08-02). Read-only, so it
        # stays on the default commit stage — same contract as the
        # workflow-lint-agent-spec-size sibling above (#1661/#1618);
        # high-frequency automated task-state commits (tasks/**,
        # eval_results/**) never match the files regex.
        files: ^(\.claude/agent-memory/[^/]+/MEMORY\.md|scripts/workflow_lint\.py)$
        pass_filenames: false

      - id: check-mcp-json-no-secrets
        name: Refuse secrets in committed .mcp.json
        entry: uv run python scripts/check_mcp_json_no_secrets.py
        language: system
        files: ^\.mcp\.json$
        pass_filenames: true

      - id: check-no-secret-shaped-strings
        name: Refuse secret-shaped strings in any staged file
        entry: uv run python scripts/check_no_secret_shaped_strings.py
        language: system
        # Run on all staged files; binary types and the allowlist are
        # handled in-script. Exclude .git/ housekeeping paths.
        exclude: ^\.git/
        pass_filenames: true
