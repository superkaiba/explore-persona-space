repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: workflow-yaml-lint
        name: Validate .claude/workflow.yaml schema + cross-references
        entry: uv run python scripts/workflow_lint.py --check-references
        language: system
        files: ^(\.claude/workflow\.yaml|\.claude/skills/issue/(SKILL|markers)\.md|CLAUDE\.md|scripts/(gh_project|workflow_lint)\.py|src/explore_persona_space/workflow\.py)$
        pass_filenames: false

      - id: check-mcp-json-no-secrets
        name: Refuse secrets in committed .mcp.json
        entry: uv run python scripts/check_mcp_json_no_secrets.py
        language: system
        files: ^\.mcp\.json$
        pass_filenames: true

      - id: check-no-secret-shaped-strings
        name: Refuse secret-shaped strings in any staged file
        entry: uv run python scripts/check_no_secret_shaped_strings.py
        language: system
        # Run on all staged files; binary types and the allowlist are
        # handled in-script. Exclude .git/ housekeeping paths.
        exclude: ^\.git/
        pass_filenames: true
